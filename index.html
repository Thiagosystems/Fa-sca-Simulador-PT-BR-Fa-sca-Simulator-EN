<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="author" content="Thiagosystems">
<meta name="theme-color" content="#f2b705">
<meta name="description" content="Faísca: simulador de comandos elétricos, eletrônica, CLP e pneumática. Feito por Thiagosystems.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faísca — simulador de comandos elétricos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6ebf1;--panel:#f7f9fb;--panel2:#eef2f6;--ink:#1b2a41;--muted:#5d6b80;--line:#cdd5df;--wire:#34445c;--gdot:#bcc6d2;--stage:#f2f5f8;--pick:#1668c9;--energy:#f2b705;--energy-ink:#241b00;--ok:#1a8754;--err:#d7263d;--warn:#c77700;--info:#1668c9;--air:#16a3b5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1520;--panel:#121c29;--panel2:#172333;--ink:#dfe6ef;--muted:#8b99ad;--line:#243246;--wire:#9fb0c6;--gdot:#223044;--stage:#0f1824;--pick:#5aa2ff;--energy:#ffcf1f;--energy-ink:#241b00;--ok:#4cc38a;--err:#ff5d6c;--warn:#ffae33;--info:#5aa2ff;--air:#3fd0e0}}
:root[data-theme="dark"]{--bg:#0d1520;--panel:#121c29;--panel2:#172333;--ink:#dfe6ef;--muted:#8b99ad;--line:#243246;--wire:#9fb0c6;--gdot:#223044;--stage:#0f1824;--pick:#5aa2ff;--energy:#ffcf1f;--energy-ink:#241b00;--ok:#4cc38a;--err:#ff5d6c;--warn:#ffae33;--info:#5aa2ff;--air:#3fd0e0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--pick);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto}
.logo{width:28px;height:28px;border-radius:7px;background:var(--energy);color:var(--energy-ink);display:grid;place-items:center}
.brand b{font-size:17px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12.5px}
.bt{display:flex;align-items:baseline;gap:9px}
.by{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 9px;white-space:nowrap}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tools button,.tools select{height:32px;padding:0 11px;border:1px solid var(--line);background:var(--panel2);border-radius:7px;cursor:pointer}
.tools button:hover,.tools select:hover{border-color:var(--muted)}
.tools .primary{background:var(--energy);color:var(--energy-ink);border-color:transparent;font-weight:600;min-width:98px}
body.sim .tools .primary{background:var(--err);color:#fff}
.tools .toggle.on{border-color:var(--pick);color:var(--pick);font-weight:600}
.tools select{max-width:170px}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
main{flex:1;min-height:0;display:grid;grid-template-columns:230px minmax(0,1fr) 340px}
.palette{overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:10px 10px 16px}
.psearch{width:100%;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:0 9px;margin-bottom:6px}
.palette details{border-bottom:1px solid var(--line);padding:4px 0}
.palette summary{cursor:pointer;font-size:12.5px;font-weight:600;padding:6px 2px;list-style:none;display:flex;justify-content:space-between;color:var(--ink)}
.palette summary::-webkit-details-marker{display:none}
.palette summary small{color:var(--muted);font-weight:400}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px 0 8px}
.pitem{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer;min-height:84px}
.pitem:hover{border-color:var(--muted)}
.pitem.on{border-color:var(--pick);box-shadow:0 0 0 2px color-mix(in srgb,var(--pick) 25%,transparent)}
.pitem svg{width:48px;height:44px;overflow:visible}
.pitem svg :is(line,path,rect,circle,ellipse,polygon){stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round}
.pitem svg .dot,.pitem svg .fillink{fill:var(--ink)}
.pitem svg .dash{stroke-dasharray:6 5;stroke-width:2}
.pitem svg text{fill:var(--ink);stroke:none;font:600 13px 'IBM Plex Mono',monospace;text-anchor:middle}
.pitem svg .tn,.pitem svg .tn6,.pitem svg .tag{display:none}
.pitem span{font-size:10.5px;line-height:1.2;text-align:center;color:var(--muted)}
body.sim .palette{opacity:.45;pointer-events:none}
.stage{position:relative;min-width:0;background:var(--stage)}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.gdot{fill:var(--gdot)}
#world .comp :is(line,path,rect,circle,ellipse,polygon){stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
#world .comp .hit{fill:transparent;stroke:none}
#world .comp.sel .hit{fill:color-mix(in srgb,var(--pick) 9%,transparent);stroke:var(--pick);stroke-width:1;stroke-dasharray:4 3}
#world .comp .dash{stroke-dasharray:4 3;stroke-width:1.3}
#world .comp .thick{stroke-width:4}
#world .comp .fillink,#world .comp .dot{fill:var(--ink)}
#world .comp .box{fill:var(--panel)}
#world .comp .on{stroke:var(--ok);stroke-width:2.6}
#world .comp .en{fill:color-mix(in srgb,var(--energy) 55%,transparent)}
#world .comp .pos{fill:color-mix(in srgb,var(--air) 22%,transparent)}
#world .comp .air{stroke:var(--air)}
#world .comp .blown{fill:var(--err);stroke:var(--err)}
#world .comp .trip,#world .comp .warnf{stroke:var(--err);stroke-dasharray:5 3}
#world .comp .srcc{fill:var(--panel);stroke-width:2.6}
#world .comp .spin{stroke:var(--energy);stroke-dasharray:10 9;stroke-width:2.6;transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
#world .comp .spin.ccw{animation-direction:reverse}
#world .comp .wave{stroke:var(--energy);animation:blink .35s infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
#world .comp .term{fill:var(--panel);stroke:var(--pick);stroke-width:1.6;cursor:crosshair}
#world .comp .term:hover{fill:var(--pick)}
#world text{stroke:none;fill:var(--ink);font-family:'IBM Plex Mono',ui-monospace,monospace}
#world .tn{font-size:8.5px;fill:var(--muted)}
#world .tn6{font-size:6.5px;fill:var(--muted);text-anchor:middle}
#world .tag{font:600 12px 'IBM Plex Sans',system-ui,sans-serif}
#world .lv{font-size:10px;font-weight:600;text-anchor:middle}
#world .ctr{text-anchor:middle}
#world .srct{font-size:10px;font-weight:600;text-anchor:middle}
#world .mt{font-size:16px;font-weight:600;text-anchor:middle}
#world .ms{font-size:10px;text-anchor:middle}
#world .note{font:500 13px 'IBM Plex Sans',sans-serif}
.wire{fill:none;stroke:var(--wire);stroke-width:2;stroke-linejoin:round;pointer-events:none}
.wire.live{stroke-width:3.2}
.wire.sel{stroke:var(--pick);stroke-width:3}
.wire.short{stroke:var(--err);stroke-width:3.2;stroke-dasharray:7 5;animation:march .6s linear infinite}
@keyframes march{to{stroke-dashoffset:-24}}
.whit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}
body.sim .whit{cursor:grab}
body.sim .comp.actv{cursor:pointer}
body.sim .comp.actv:hover .hit{fill:color-mix(in srgb,var(--energy) 16%,transparent)}
#oL{pointer-events:none}
.ghost{opacity:.55}
.ghost :is(line,path,rect,circle,ellipse,polygon){stroke:var(--pick);stroke-width:2;fill:none}
.ghost text{display:none}
.selbox{fill:color-mix(in srgb,var(--pick) 8%,transparent);stroke:var(--pick);stroke-width:1;stroke-dasharray:5 4}
#world .rd{font:500 9.5px 'IBM Plex Mono',monospace;fill:var(--muted)}
#world .rd.live{fill:var(--pick);font-weight:600}
#world .rd.bad{fill:var(--err);font-weight:700}
#world .burnx line{stroke:var(--err)!important;stroke-width:3!important}
.tsec{border-top:1px dashed var(--line);margin-top:12px;padding-top:4px}.tsec h4{margin:6px 0;font-size:12.5px}.tsec.ok h4{color:var(--ok)}
.tlist{margin:4px 0 8px;padding-left:18px;font-size:12px}
.mread{font:600 22px 'IBM Plex Mono',monospace;background:#0d1b14;color:#7CFC9A;border-radius:8px;padding:8px 12px;margin-top:8px;text-align:right}
#train .row button.on{border-color:var(--pick);color:var(--pick);font-weight:600}
.tmark circle{stroke:var(--stage);stroke-width:2}.tmark.tp circle{fill:var(--warn)}.tmark.tf circle{fill:var(--ok)}
#world .tmark text,#world .probe text{fill:#fff;font:700 11px 'IBM Plex Sans',sans-serif;text-anchor:middle}
.probe circle{stroke:#fff;stroke-width:2}.probe.pr circle{fill:#e23d3d}.probe.pb circle{fill:#222}#world .probe text{fill:var(--ink);font-size:13px}
.pread rect{fill:#0d1b14;stroke:#7CFC9A}#world .pread text{fill:#7CFC9A;font:600 12px 'IBM Plex Mono',monospace}
.stabs{cursor:move;user-select:none}
.meas .row button{font-size:12px}
#scope{position:absolute;right:12px;bottom:34px;width:410px;max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px 10px 10px;z-index:3}
#scope[hidden]{display:none}
.stabs{display:flex;align-items:center;gap:6px;margin-bottom:6px}.stabs b{font-size:13px;margin-right:auto}
.stabs button{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer}.stabs button.on{border-color:var(--pick);color:var(--pick);font-weight:600}
.ssvg{width:100%;height:auto;display:block;background:#0d1b14;border-radius:6px}
.ssvg .sg{stroke:#ffffff1c;stroke-width:1}.ssvg .s0{stroke:#ffffff45}.ssvg .tr{fill:none;stroke-width:2;stroke-linejoin:round}
.shead{font-size:11.5px;color:var(--muted);margin:6px 0 3px}.sinfo{font:500 11.5px/1.5 'IBM Plex Mono',monospace;color:var(--ink);margin-top:6px}
.meas h4{margin:12px 0 6px;font-size:12.5px}
.mtab{width:100%;border-collapse:collapse;font-size:12.5px}
.mtab td{padding:4px 0;border-bottom:1px dashed var(--line)}
.mtab td:last-child{text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:600}
.meas-bad{color:var(--err);font-size:12px;font-weight:600;margin:6px 0 0}
.wprev{fill:none;stroke:var(--pick);stroke-width:2;stroke-dasharray:5 4}
.wstart{fill:var(--pick)}
.badge circle{stroke:var(--stage);stroke-width:2}
.badge.erro circle{fill:var(--err)}.badge.aviso circle{fill:var(--warn)}
#world .badge text{fill:#fff;font:700 11px 'IBM Plex Sans',sans-serif;text-anchor:middle}
.flash{fill:none;stroke:var(--err);stroke-width:2.5;animation:blink .45s ease-in-out 4 alternate}
@keyframes blink{from{opacity:1}to{opacity:.15}}
#banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:var(--err);color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 24px);flex-wrap:wrap;z-index:2}
#banner[hidden]{display:none}
#banner span{font-size:13px;opacity:.95}
#banner button{background:#fff;color:#a3122a;border:0;border-radius:6px;padding:6px 12px;font-weight:600;cursor:pointer}
.simtag{position:absolute;top:12px;left:12px;display:none;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:12px;font-weight:600}
.simtag::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--energy);animation:blink .8s infinite alternate}
body.sim .simtag{display:flex}
#toast{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 24px);z-index:5;text-align:center}
#toast[hidden]{display:none}#toast.err{background:var(--err);color:#fff}
.wh .whc{fill:var(--panel);stroke:var(--pick);stroke-width:2.5}
.wh:hover .whc{fill:var(--pick)}
.pchip{position:absolute;top:12px;right:12px;max-width:min(260px,45%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}
.pchip::before{content:'Projeto: ';font-weight:400;color:var(--muted)}
.pchip:hover{border-color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:0 24px 70px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(8,14,24,.55)}
.dlg{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:16px}.dlg>p{margin:0}
.dlg button{height:32px;padding:0 11px;border:1px solid var(--line);background:var(--panel2);border-radius:7px;cursor:pointer}
.dlg button:hover:not(:disabled){border-color:var(--muted)}
.dlg button.primary{background:var(--energy);color:var(--energy-ink);border-color:transparent;font-weight:600}
.dlg button.danger{color:var(--err)}
.prow{display:flex;gap:8px}
.prow input{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:0 9px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:52vh}
.plist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.plist li.cur{border-color:var(--pick);box-shadow:0 0 0 2px color-mix(in srgb,var(--pick) 22%,transparent)}
.plist .pn{height:30px;border:1px solid transparent;background:transparent;border-radius:6px;padding:0 6px;font-weight:600;min-width:0}
.plist .pn:hover,.plist .pn:focus{border-color:var(--line);background:var(--panel)}
.plist small{grid-column:1;color:var(--muted);font-size:12px;padding-left:6px}
.plist .pa{grid-column:2;grid-row:1 / span 2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.plist li{grid-template-columns:1fr}.plist .pa{grid-column:1;grid-row:auto;justify-content:flex-start}}
#hint{position:absolute;left:12px;bottom:10px;right:12px;font-size:12px;color:var(--muted);pointer-events:none;text-shadow:0 0 5px var(--stage)}
.side{overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h3{margin:0 0 8px;font-size:14px}
.card label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);margin:8px 0}
.card label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.card input,.card select,.card textarea{height:32px;border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:0 8px;color:var(--ink);font-family:'IBM Plex Mono',monospace}
.card label.chk input{height:auto}
.row{display:flex;gap:6px;margin-top:10px}
.row button{flex:1;height:32px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
.row .danger{color:var(--err)}
button:disabled,input:disabled,select:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}.small{font-size:12px}
.help{padding-left:18px;margin:0;font-size:13px;line-height:1.45}.help li{margin:4px 0}
kbd{font-family:'IBM Plex Mono',monospace;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--panel)}
.keys{font-size:12px;color:var(--muted);line-height:2.1;margin:10px 0 0}
.dhead{display:flex;align-items:center;justify-content:space-between}
.dhead h3{margin:0}
#dstate{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
body.sim #dstate::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--energy);animation:blink .8s infinite alternate}
.tabs{display:flex;gap:3px;margin:10px 0;background:var(--panel);padding:3px;border-radius:9px;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.tabs button.on{background:var(--panel2);color:var(--ink);font-weight:600}
#pc{font-size:10.5px;padding:0 6px;border-radius:10px;margin-left:4px;font-weight:700}
#pc.e{background:var(--err);color:#fff}#pc.a{background:var(--warn);color:#1a1200}#pc:empty{display:none}
.nar{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.nar li{padding:8px 10px 8px 27px;position:relative;background:var(--panel);border-radius:8px;border:1px solid var(--line);font-size:13px}
.nar li::before{content:'';position:absolute;left:11px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.nar li.on::before{background:var(--energy);box-shadow:0 0 0 2px color-mix(in srgb,var(--energy) 30%,transparent)}
.nar li.e::before{background:var(--err)}.nar li.w::before{background:var(--warn)}.nar li.a::before,.nar li.m::before{background:var(--info)}.nar li.ok::before{background:var(--ok)}.nar li.p::before{background:var(--air)}
.iss{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--muted);background:var(--panel);border-radius:8px;padding:9px 10px;margin-bottom:7px;cursor:pointer}
.iss:hover{border-color:var(--muted)}
.iss.erro{border-left-color:var(--err)}.iss.aviso{border-left-color:var(--warn)}.iss.info{border-left-color:var(--info)}
.iss b{display:block;font-size:13px;margin:2px 0 3px}
.iss small{color:var(--muted);font-size:12px;line-height:1.45;display:block}
.chip{font-size:11px;font-weight:600}
.iss.erro .chip{color:var(--err)}.iss.aviso .chip{color:var(--warn)}.iss.info .chip{color:var(--info)}
.okmsg{color:var(--ok);font-weight:600}
.log{list-style:none;padding:0;margin:0;font-size:12.5px}
.log li{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.log time{font-family:'IBM Plex Mono',monospace;color:var(--muted);min-width:42px}
.log li.on{color:var(--ok)}.log li.e{color:var(--err);font-weight:600}.log li.off{color:var(--muted)}
#diag[hidden]{display:none}
@media (max-width:1600px){.bt span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:900px){
 html,body{height:auto}body{overflow:auto}
 main{display:flex;flex-direction:column}
 .palette{border-right:0;border-bottom:1px solid var(--line);max-height:40vh}
 .pgrid{grid-template-columns:repeat(4,1fr)}
 .stage{height:62vh}
 .side{border-left:0;overflow:visible}
 .brand span{display:none}
}

/* ---- barra de ferramentas organizada em grupos ---- */
.top{flex-wrap:nowrap;gap:14px}
.brand{margin-right:0;flex:none}
.tools{flex:1;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grp{display:flex;align-items:center;gap:6px}
.seg{gap:0;border:1px solid var(--line);border-radius:8px;background:var(--panel2);overflow:hidden}
.tools .seg>button{height:32px;border:0;border-radius:0;background:transparent;border-right:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;padding:0 11px}
.tools .seg>button:last-child{border-right:0}
.tools .seg>button:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 7%,transparent)}
.tools .seg>button.ic{padding:0 9px}
.tools .seg>button.toggle.on{background:color-mix(in srgb,var(--pick) 14%,transparent);color:var(--pick);font-weight:600}
.tools .seg>button.del:not(:disabled){color:var(--err)}
.tools button svg{flex:none}
.tools select{max-width:190px}
#bSim{margin:0 auto;display:inline-flex;align-items:center;gap:7px;padding:0 18px;min-width:118px;justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.08)}

.menu{position:relative}
.tools .mbtn{display:inline-flex;align-items:center;gap:7px}
.mbtn .car{font-size:10px;opacity:.7}
.mbtn[aria-expanded="true"]{border-color:var(--pick)!important;color:var(--pick)}
.mlist{position:absolute;top:calc(100% + 6px);left:0;z-index:20;min-width:280px;white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.22);padding:6px}

.tools .mlist button{display:flex;align-items:center;gap:10px;width:100%;height:36px;border:0;background:transparent;border-radius:7px;padding:0 10px;text-align:left}
.tools .mlist button:hover:not(:disabled),.tools .mlist button:focus-visible{background:color-mix(in srgb,var(--pick) 12%,transparent)}
.mlist button span{flex:1}.mlist kbd{font-size:10.5px}

/* ---- folhas, documentação, janelas e tutorial ---- */
.mlist .chk{width:16px;text-align:center;color:var(--pick);font-weight:700;visibility:hidden}.mlist [aria-checked="true"] .chk{visibility:visible}
#sheets{position:absolute;left:12px;top:12px;display:flex;gap:4px;align-items:center;z-index:2;max-width:calc(100% - 260px);overflow-x:auto;padding:2px}
#sheets button{height:28px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:0 10px;font-size:12.5px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
#sheets button.on{border-color:var(--pick);color:var(--pick);font-weight:600;background:color-mix(in srgb,var(--pick) 10%,var(--panel))}
#sheets button b{font-family:'IBM Plex Mono',monospace;font-weight:600;opacity:.75}
#sheets .x{border:0;background:transparent;height:auto;padding:0 2px;color:var(--muted)}
#sheets input{height:26px;width:130px;border:1px solid var(--pick);border-radius:6px;padding:0 6px;background:var(--panel);color:var(--ink)}
body.sim .simtag{top:48px}
#world .frm{fill:none;stroke:var(--muted);stroke-width:1.2}
#world .frmc{fill:none;stroke:var(--line);stroke-width:1}
#world text.frmt{font:600 11px 'IBM Plex Sans',sans-serif;fill:var(--muted);text-anchor:middle}
#world text.stt{font:700 15px 'IBM Plex Sans',sans-serif;fill:var(--ink)}
#world text.stl{font:500 8px 'IBM Plex Sans',sans-serif;fill:var(--muted)}
#world text.stv{font:600 11px 'IBM Plex Sans',sans-serif;fill:var(--ink)}
#world .stb{fill:var(--panel);stroke:var(--muted);stroke-width:1.2}
#world .wnum rect{fill:var(--stage);stroke:var(--wire);stroke-width:.8}
#world .wnum text{font:600 8.5px 'IBM Plex Mono',monospace;fill:var(--ink);text-anchor:middle}
#world text.xr{font:500 8.5px 'IBM Plex Mono',monospace;fill:var(--info)}
#nL{pointer-events:none}
#modal{position:fixed;inset:0;background:rgba(10,16,24,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
#modal .dlg{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.35);width:min(720px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column}
#modal .dh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}#modal .dh h2{margin:0;font-size:16px}
#modal .db{padding:14px 18px;overflow:auto}#modal .df{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
#modal button{height:34px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:0 14px;cursor:pointer}#modal button.pri{background:var(--energy);color:var(--energy-ink);border-color:transparent;font-weight:600}
#modal .x{border:0;background:transparent;font-size:20px;height:auto;padding:0 4px}
#modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}#modal label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
#modal input{height:34px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--ink);padding:0 9px;font:inherit}
.bom{width:100%;border-collapse:collapse;font-size:13px}.bom th{text-align:left;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px}.bom td{border-bottom:1px dashed var(--line);padding:7px 8px;vertical-align:top}.bom td:first-child{font-family:'IBM Plex Mono',monospace;font-weight:600;text-align:right;width:44px}.bom td:last-child{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
#tour{position:fixed;inset:0;z-index:60;pointer-events:none}#tour[hidden]{display:none}
#tour .hole{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(8,14,22,.62);transition:all .25s ease;pointer-events:none;outline:2px solid var(--energy)}
#tour .tcard{position:fixed;width:min(340px,calc(100vw - 24px));background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 44px rgba(0,0,0,.35);padding:14px 16px;pointer-events:auto;transition:all .25s ease}
#tour .tcard h3{margin:0 0 6px;font-size:15px}#tour .tcard p{margin:0 0 12px;font-size:13px;line-height:1.5}
#tour .tnav{display:flex;align-items:center;gap:8px}#tour .tnav span{margin-right:auto;font-size:12px;color:var(--muted)}
#tour button{height:32px;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:0 12px;cursor:pointer;color:var(--ink)}#tour button.pri{background:var(--energy);color:var(--energy-ink);border-color:transparent;font-weight:600}
@media (prefers-reduced-motion:reduce){#tour .hole,#tour .tcard{transition:none}}

#world .wire.gy{stroke:#f0cc00;stroke-dasharray:7 7;stroke-width:2}
#world .wire.cw-br{filter:drop-shadow(0 0 1px rgba(0,0,0,.7))}
#world .snapt{fill:none;stroke:var(--ok);stroke-width:2.5}
#world .snapw{fill:var(--ok);stroke:var(--stage);stroke-width:1.5}
.swatches{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.swatches .sw{width:28px;height:28px;border-radius:7px;border:2px solid var(--line);background:var(--c);cursor:pointer;padding:0}
.swatches .sw.gy{background:repeating-linear-gradient(45deg,#2e9e4f 0 6px,#f0cc00 6px 12px)}
.swatches .sw.auto{background:var(--panel);font:700 12px 'IBM Plex Sans',sans-serif;color:var(--muted)}
.swatches .sw.on{border-color:var(--pick);box-shadow:0 0 0 2px color-mix(in srgb,var(--pick) 35%,transparent)}
.ifix{display:block;width:100%;margin:-4px 0 9px;height:32px;border:1px solid var(--pick);color:var(--pick);background:color-mix(in srgb,var(--pick) 8%,var(--panel));border-radius:0 0 8px 8px;font-weight:600;cursor:pointer}

/* ---- configurações ---- */
@media (max-width:1280px){.tools select{max-width:118px}.tools{gap:7px}#bSim{min-width:96px;padding:0 12px}}
body.no-val #world .rd:not(.live){display:none}
body.no-live #world .rd.live{display:none}
body.no-tn #world text.tn{display:none}
body.no-grid .gdot{display:none}
body.no-badge #world .badge{display:none}
body.no-anim #world .spin,body.no-anim #world .wave,body.no-anim .simtag::before,body.no-anim #dstate::before{animation:none}
#modal .cfgh{font-size:13.5px;margin:18px 0 8px}
#modal .cfgl{display:grid;gap:8px}
#modal label.chk{flex-direction:row;align-items:center;gap:9px;color:var(--ink);font-size:13.5px;cursor:pointer}
#modal label.chk input{height:auto;width:17px;margin:0}
#modal select{height:34px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--ink);padding:0 8px;font:inherit}

/* ---- esconder/mostrar paleta, painel lateral e barra ---- */
.tools [hidden],.mlist [hidden]{display:none!important}
@media (min-width:901px){
 main>.palette{grid-column:1;grid-row:1}main>.stage{grid-column:2;grid-row:1}main>.side{grid-column:3;grid-row:1}
 body.hide-pal main{grid-template-columns:0 minmax(0,1fr) 340px}
 body.hide-side main{grid-template-columns:230px minmax(0,1fr) 0}
 body.hide-pal.hide-side main{grid-template-columns:0 minmax(0,1fr) 0}
}
body.hide-pal main>.palette,body.hide-side main>.side,body.hide-bar>.top{display:none}
#paneTabs .ptab{position:absolute;z-index:4;display:grid;place-items:center;border:0;background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted);cursor:pointer;padding:0;opacity:.55;transition:opacity .15s,background .15s,color .15s}
#paneTabs .ptab:hover,#paneTabs .ptab:focus-visible{opacity:1;color:var(--pick);background:color-mix(in srgb,var(--pick) 16%,transparent)}
#paneTabs .pl{left:0;top:50%;transform:translateY(-50%);width:12px;height:34px;border-radius:0 6px 6px 0}
#paneTabs .pr{right:0;top:50%;transform:translateY(-50%);width:12px;height:34px;border-radius:6px 0 0 6px}
#paneTabs .ptop{position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:4;display:flex;gap:6px;align-items:flex-start}
#paneTabs .pt{position:static;width:34px;height:12px;border-radius:0 0 6px 6px}
#paneTabs .psim{height:22px;margin-top:3px;border:0;border-radius:6px;background:var(--energy);color:var(--energy-ink);font-weight:600;font-size:12px;padding:0 10px;cursor:pointer}
body.sim #paneTabs .psim{background:var(--err);color:#fff}
@media (max-width:900px){#paneTabs .pl,#paneTabs .pr{display:none}}
@media print{#paneTabs{display:none}}
</style>

<script>/* configurações e idioma (lidos antes de tudo) */
const CFG=(()=>{try{const o=JSON.parse(localStorage.getItem('faisca-cfg')||'{}');return o&&typeof o==='object'?o:{}}catch(e){return{}}})(),LANG=CFG.lang==='en'?'en':'pt',DEC=LANG==='en'?'.':',';
/* ================= utilitários ================= */
const G=20,EMPTY=new Set(),PH=['L1','L2','L3'],CW=['L1L2L3','L2L3L1','L3L1L2'];
const COL={L1:'#e8742a',L2:'#c99a00',L3:'#9b5de5',N:'#2f7ae5',PE:'#2e9e4f',P:'#e0457b',Z:'#7a8799',AR:'#16a3b5',ESC:'#9fb0bf','LAD+':'#e0457b',LAD0:'#7a8799'};
const LCOL={amarela:'#f2b705',verde:'#22b35e',vermelha:'#e23d3d',azul:'#3a86ff',branca:'#dfe6ef'};
const $=s=>document.querySelector(s);
let S={comps:[],wires:[],seq:1},mode='edit',tool=null,sel=null,diagOn=true,diagTab='agora',soundOn=true;
let view={x:40,y:30,s:1},rt=null,timer=null,hist=[],drag=null,ptr={x:0,y:0},ISS={issues:[],summary:[]},flashIds=null,flashT,lastD='';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const snap=v=>Math.round(v/G)*G,K=(id,i)=>id+':'+i,byId=id=>S.comps.find(c=>c.id===id);
const rng=n=>Array.from({length:n},(_,i)=>i),PX=p=>rng(p).map(i=>i*40-(p-1)*20);
const V2=[[0,-40],[0,40]],P3=[[-40,-40],[0,-40],[40,-40],[-40,40],[0,40],[40,40]];
const L=(a,b,c,d,cl)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"${cl?` class="${cl}"`:''}/>`;
const P=(d,cl,ex='')=>`<path d="${d}"${cl?` class="${cl}"`:''}${ex}/>`;
const R=(x,y,w,h,cl,ex='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}"${cl?` class="${cl}"`:''}${ex}/>`;
const C=(x,y,r,cl,ex='')=>`<circle cx="${x}" cy="${y}" r="${r}"${cl?` class="${cl}"`:''}${ex}/>`;
const T=(x,y,s,r,cl)=>`<text x="${x}" y="${y}" class="${cl||''}" transform="rotate(${-(r||0)} ${x} ${y})">${esc(s)}</text>`;
const TL=(r,a,b,x=0)=>T(x+6,-26,a,r,'tn')+T(x+6,34,b,r,'tn');

/* ---- potenciais: cada rótulo de fonte vira um "potencial" ---- */
function pot(l){if(l==='AR'||l==='ESC'||l==='LAD+'||l==='LAD0')return l;const i=l.lastIndexOf(':'),b=i<0?l:l.slice(i+1);
 if(b==='+')return'P';if(b==='-')return'Z';if(b==='N')return'N';if(b==='PE')return'PE';return l}
const isE=p=>p==='N'||p==='PE'||p==='Z',isPn=p=>p==='AR'||p==='ESC',isLad=p=>p==='LAD+'||p==='LAD0';
const phOf=l=>{const b=l.slice(l.lastIndexOf(':')+1);return PH.includes(b)?b:null};
const isHigh=p=>p==='P'||!!phOf(p)&&!isPn(p)&&!isLad(p),isLow=p=>p==='Z'||p==='N';
function col(l){if(!l)return'#888';return COL[l]||COL[pot(l)]||COL[phOf(l)]||'#3aa0a0'}
function energ(a,b){for(const x of a){const px=pot(x);if(isPn(px))continue;for(const y of b){const py=pot(y);if(px===py||isPn(py))continue;if(isE(px)&&isE(py))continue;if(isLad(px)!==isLad(py))continue;return true}}return false}
function conflict(s){const ps=[...new Set([...s].map(pot))].filter(p=>!isPn(p));for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){if(isE(ps[i])&&isE(ps[j]))continue;return[ps[i],ps[j]]}return null}
function phL(s){let r=null;for(const l of s){const p=pot(l);if(phOf(l)&&!isPn(p)){if(r&&pot(r)!==p)return null;r=l}}return r}
const hasPot=(s,p)=>[...s].some(l=>pot(l)===p);
function makeUF(){const p={},f=k=>{if(p[k]===undefined)p[k]=k;while(p[k]!==k){p[k]=p[p[k]];k=p[k]}return k};return{f,u:(a,b)=>{a=f(a);b=f(b);if(a!==b)p[a]=b}}}

/* ---- acesso às definições ---- */
const D=c=>DEFS[c.type],fv=(v,c)=>typeof v==='function'?v(c):v;
const termsOf=c=>fv(D(c).T,c)||[],boxOf=c=>fv(D(c).B,c),namesOf=c=>fv(D(c).N,c)||[],ownOf=c=>fv(D(c).own,c),linkOf=c=>fv(D(c).link,c),domOf=c=>D(c).dom||'e',actOf=c=>!!fv(D(c).act,c)||!!(mode==='sim'&&rt&&rt.burnt&&rt.burnt[c.id]);
const tn=(c,i)=>namesOf(c)[i]||String(i+1);
const lab=c=>{const n=c.nm||D(c).n;if(c.type==='src')return`Fonte ${c.v}`;return c.tag?`${n} ${c.tag}`:n};

/* ---- estado de simulação visto pelo desenho ---- */
const SIM=()=>!!(mode==='sim'&&rt&&rt.res);
const ON=t=>!!(SIM()&&rt.res.out[t]),EN=id=>!!(SIM()&&rt.res.en[id]),DS=id=>SIM()?rt.res.ds[id]:0;
const actu=c=>rt.pressed.has(c.id)||!!rt.btn[c.id],detect=c=>c.by?!!rt.pos[c.by]:!!rt.btn[c.id];
const ACTU=c=>SIM()&&actu(c),DET=c=>SIM()&&detect(c),GET=n=>SIM()&&getName(n,rt.E);
const tim=c=>rt.tim[c.id]||(rt.tim[c.id]={el:0,done:false,hold:0,ph:true});

/* ---- contatos IEC ---- */
function cNA(cl,x=0){return L(x,-40,x,-12)+L(x,12,x,40)+L(x,12,cl?x-1:x-13,-12,cl&&SIM()?'on':'')}
function cNF(cl,x=0){return L(x,-40,x,-12)+L(x,-12,x+10,-12)+L(x,12,x,40)+L(x,12,cl?x+12:x-11,cl?-14:-11,cl&&SIM()?'on':'')}
function cCO(a){return P('M-20,-40V-24L-10,-12M20,-40V-24L10,-12')+L(0,40,0,12)+L(0,12,a?11:-11,-13,SIM()?'on':'')}
function ACT(k,end,latch){const d=L(k==='therm'?-26:k==='roll'?-26:-24,0,end,0,'dash');let g='';
 if(k==='push')g='M-19,-7H-24V7H-19';else if(k==='sel')g='M-18,-7H-24V7H-30';else if(k==='timer')g='M-24,-7A7,7 0 0 0 -24,7';
 else if(k==='therm')g='M-38,5V-5H-32V5H-26';else if(k==='emerg')g='M-24,-10A10,10 0 0 0 -24,10Z';else if(k==='sw')g='M-24,-7V7';
 else if(k==='key')g='M-24,0H-28M-32,0m-4,0a4,4 0 1 0 8,0a4,4 0 1 0 -8,0';else if(k==='roll')g='M-26,-6L-32,0L-26,6M-36,0m-4,0a4,4 0 1 0 8,0a4,4 0 1 0 -8,0';
 return d+P(g)+(latch?P('M-17,-12l3,4l3,-4'):'')}
function COIL(c,inner=''){return L(0,-40,0,-10)+R(-16,-10,32,20,EN(c.id)?'en':'')+inner+L(0,10,0,40)+TL(c.r,'A1','A2')}
function MOT(c,sub,leads){const m=SIM()?rt.res.mot[c.id]:null;return P(leads)+C(0,10,28,m&&m.st==='run'?'en':m&&m.st!=='off'?'warnf':'')+T(0,12,'M',c.r,'mt')+T(0,27,sub,c.r,'ms')+(m&&m.st==='run'?C(0,10,36,'spin '+(m.dir||'cw')):'')}
function BOX(w,h,title,r,extra=''){return R(-w/2,-h/2,w,h,'box',' rx="4"')+T(0,-h/2+13,title,r,'ctr')+extra}
/* ================= componentes ================= */
const SUP={FN:['L1','N'],FNPE:['L1','N','PE'],'2F':['L1','L2'],'3F':['L1','L2','L3'],'3FN':['L1','L2','L3','N'],'3FPE':['L1','L2','L3','PE'],'3FNPE':['L1','L2','L3','N','PE'],DC:['+','-']};
const MPOWN={fu:'F',fs:'F',sec:'Q',dr:'DR',dj:'Q',dm:'Q',k:null};
function mpClosed(c){if(!SIM())return c.k==='fu';return c.k==='k'?ON(c.tag):!rt.open[c.id]&&!rt.trip[c.id]}
function mpClick(c){const t=rt.trip[c.id];
 if(c.k==='fu'){if(t){delete rt.trip[c.id];logE(`${c.tag} trocado`,'a')}return}
 if(t){delete rt.trip[c.id];logE(`${c.tag} rearmado`,'a');return}
 if(c.k==='dr'){rt.trip[c.id]=true;logE(`${c.tag}: botão de teste acionado, DR desarmou`,'a');return}
 rt.open[c.id]=!rt.open[c.id];logE(`${c.tag} ${rt.open[c.id]?'aberto':'fechado'}`,'a')}
const nearPh=(X,i)=>phL(X.set(i));

const DEFS={
/* ---------- alimentação ---------- */
src:{n:'Fonte',T:[[0,20]],N:['saída'],B:[-16,-16,32,38],nolbl:1,def:{v:'L1'},F:[['v','Tipo','sel',['L1','L2','L3','N','PE','+','-']]],
 draw:c=>L(0,13,0,20)+C(0,0,13,'srcc',` style="stroke:${col(c.v)}"`)+T(0,4,c.v==='-'?'−':c.v,c.r,'srct'),src:c=>[[0,c.v]]},

 B:c=>{const w=(SUP[c.k].length-1)*40;return[-w/2-18,-18,w+36,40]},

 src:c=>SUP[c.k].map((l,i)=>[i,l])},
bat:{n:'Bateria',own:'G',T:V2,N:['+','−'],B:[-18,-40,36,80],draw:c=>L(0,-40,0,-6)+L(-14,-6,14,-6)+L(-7,4,7,4,'thick')+L(0,4,0,40)+T(12,-12,'+',c.r,'tn')+T(12,20,'−',c.r,'tn'),src:c=>[[0,c.tag+':+'],[1,c.tag+':-']]},
psu:{n:'Fonte retificadora 24 Vcc',own:'G',T:[[-20,-40],[20,-40],[-20,40],[20,40]],N:['L','N','+','−'],B:[-34,-40,68,80],
 draw:c=>P('M-20,-40V-22M20,-40V-22M-20,22V40M20,22V40')+R(-32,-22,64,44,DS(c.id)?'en':'box',' rx="3"')+L(-32,22,32,-22)+T(-16,-4,'~',c.r,'ms')+T(16,14,'=',c.r,'ms')+TL(c.r,'L','+',-20)+T(26,-26,'N',c.r,'tn'),
 der:(c,X,N)=>{if(X.energ(0,1)){X.push(2,c.tag+':+');X.push(3,c.tag+':-');N.ds[c.id]=1}}},
rect:{n:'Retificador (ponte)',own:'V',T:[[-20,-40],[20,-40],[-20,40],[20,40]],N:['~','~','+','−'],B:[-32,-40,64,80],
 draw:c=>P('M-20,-40V-22M20,-40V-22M-20,22V40M20,22V40')+R(-30,-22,60,44,'box',' rx="3"')+P('M0,-16L16,0L0,16L-16,0Z')+P('M-5,-4H5L0,5Z','fillink')+T(-24,-26,'~',c.r,'tn')+T(-24,34,'+',c.r,'tn'),
 der:(c,X,N)=>{if(X.energ(0,1)){X.push(2,c.tag+':+');X.push(3,c.tag+':-');N.ds[c.id]=1}}},
xfmr:{n:'Transformador',own:'T',T:[[-20,-40],[20,-40],[-20,40],[20,40]],N:['H1','H2','X1','X2'],B:[-32,-40,64,80],

 der:(c,X,N)=>{if(X.energ(0,1)){X.push(2,c.tag+':a');X.push(3,c.tag+':b');N.ds[c.id]=1}}},

 draw:c=>P('M-40,-40V-24M0,-40V-24M40,-40V-24M-40,40V24M0,40V24M40,40V24M80,40V24')+R(-52,-24,144,48,'box',' rx="4"')+C(10,-6,14)+C(10,8,14)+T(-30,4,'Δ',c.r,'ms')+T(56,4,'Y',c.r,'ms'),
 der:(c,X,N)=>{const on=X.energ(0,1)||X.energ(1,2)||X.energ(0,2);if(!on)return;N.ds[c.id]=1;[0,1,2].forEach(i=>{const l=nearPh(X,i);if(l)X.push(3+i,c.tag+':'+phOf(l))});X.push(6,c.tag+':N')}},
diode:{n:'Diodo',own:'V',T:V2,N:['A','K'],B:[-14,-40,28,80],draw:c=>L(0,-40,0,-8)+P('M-10,-8H10L0,8Z',DS(c.id)?'en':'fillink')+L(-10,8,10,8)+L(0,8,0,40)+TL(c.r,'A','K'),
 cond:(c,E)=>E.ds[c.id]?[[0,1]]:[],
 der:(c,X,N)=>{const a=X.set(0),k=X.set(1),hi=s=>[...s].some(l=>isHigh(pot(l))),lo=s=>[...s].some(l=>isLow(pot(l)));N.ds[c.id]=!(hi(k)&&!hi(a))&&(hi(a)||lo(k))?1:0}},
sock:{n:'Tomada 2P+T',own:'X',act:1,T:[[-20,40],[0,40],[20,40]],N:['F','N','PE'],B:[-26,-24,52,64],
 draw:c=>P('M-20,40V14M0,40V22M20,40V14')+C(0,0,22,EN(c.id)?'en':'')+C(-8,-2,3)+C(8,-2,3)+L(0,6,0,13)+T(-20,36,'F',c.r,'tn'),
 load:c=>rt&&rt.man[c.id]?[[0,1]]:[],click:c=>{rt.man[c.id]=!rt.man[c.id];logE(`${c.tag}: aparelho ${rt.man[c.id]?'ligado':'desligado'}`,'a')},
 say:(c,X)=>EN(c.id)?['on',`${c.tag}: aparelho ligado e funcionando`]:X.energ(0,1)?['i',`${c.tag} com tensão (clique para ligar um aparelho)`]:null},

mp:{n:'Dispositivo multipolar',def:{k:'fu',p:1,n:false},own:c=>MPOWN[c.k],link:c=>c.k==='k'?'coil':null,act:c=>c.k!=='k',prot:c=>['fu','fs','dr','dj','dm'].includes(c.k),
 F:[['k','Tipo','sel',[['fu','Fusível'],['fs','Fusível-seccionador'],['sec','Interruptor seccionador'],['dr','Interruptor diferencial (DR)'],['dj','Disjuntor termomagnético'],['dm','Disjuntor-motor'],['k','Contator (contatos principais)']]],['p','Polos','sel',['1','2','3','4']],['n','Último polo é neutro','bool']],
 T:c=>{const x=PX(+c.p);return[...x.map(v=>[v,-40]),...x.map(v=>[v,40])]},
 N:c=>{const a=[],b=[];for(let i=0;i<c.p;i++){const nn=c.n&&i===c.p-1;a.push(nn?'N':String(2*i+1));b.push(nn?'N':String(2*i+2))}return[...a,...b]},
 B:c=>{const w=(c.p-1)*40,l=c.k==='dm'||c.k==='dr'?36:18;return[-w/2-l,-40,w+l+18,80]},
 cond:(c,E)=>{const on=c.k==='k'?!!E.out[c.tag]:!rt.open[c.id]&&!rt.trip[c.id];return on?rng(+c.p).map(i=>[i,i+ +c.p]):[]},
 click:mpClick,
 draw:c=>{const p=+c.p,xs=PX(p),nm=namesOf(c),cl=mpClosed(c),tr=SIM()&&!!rt.trip[c.id];let s='';
  xs.forEach((x,i)=>{if(c.k==='fu')s+=L(x,-40,x,-18)+R(x-6,-18,12,36,tr?'blown':'')+L(x,-18,x,18)+L(x,18,x,40);
   else{s+=cNA(cl,x);if(c.k==='fs')s+=R(x-5,16,10,18,tr?'blown':'');else if(c.k==='sec')s+=L(x-5,-12,x+5,-12);else if(c.k==='k')s+=P(`M${x-6},-12A6,6 0 0 0 ${x+6},-12`);else s+=P(`M${x-4},-16l8,8M${x+4},-16l-8,8`,tr?'trip':'')}
   s+=T(x+7,-28,nm[i],c.r,'tn')+T(x+7,36,nm[i+p],c.r,'tn')});

  if(c.k==='dm')s+=R(xs[0]-34,-8,14,16,tr?'trip':'')+T(xs[0]-27,3,'I>',c.r,'tn6');
  return s}},

 cond:()=>[[0,3],[1,4],[2,5]],click:c=>{rt.ft[c.tag]=!rt.ft[c.tag];logE(rt.ft[c.tag]?`${c.tag} atuou (sobrecarga simulada)`:`${c.tag} rearmado`,rt.ft[c.tag]?'e':'a')},

/* ================= arquivo .fais ================= */
/* .fais = arquivo do Faísca (JSON): {formato:'faisca', versao, esquema:{comps,wires,seq}} */
const FAIS_V=1;
let fname='esquema-faisca',toastT;
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className=err?'err':'';t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},err?6500:3500)}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
/* nome de arquivo: só ASCII (sem acento), para não dar problema em nenhum sistema ou navegador */
const safeName=s=>String(s||'').replace(/\.(fais|json)$/i,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9_ -]+/g,'').trim().replace(/\s+/g,'-').slice(0,60)||'esquema-faisca';
const cleanName=s=>String(s==null?'':s).replace(/[\u0000-\u001f]/g,'').trim().slice(0,60);
const num=v=>typeof v==='number'&&Number.isFinite(v);

function saveFais(){
 const doc={formato:'faisca',versao:FAIS_V,app:'Faísca',autor:'Thiagosystems',criado:new Date().toISOString(),esquema:{comps:S.comps,wires:S.wires,seq:S.seq}};
 const nome=safeName(fname)+'.fais';
 download(new Blob([JSON.stringify(doc,null,1)],{type:'application/json'}),nome);toast('Esquema salvo como '+nome)}

/* valida e limpa um esquema (de um .fais ou de um projeto guardado); lança Error em português se estiver quebrado */
function cleanState(e){
 if(!e||typeof e!=='object'||!Array.isArray(e.comps)||!Array.isArray(e.wires))throw new Error('O arquivo está incompleto: faltam os componentes ou os fios.');
 if(e.comps.length>2000||e.wires.length>6000)throw new Error('O esquema do arquivo é grande demais para abrir.');
 const idOk=v=>typeof v==='string'&&/^[A-Za-z0-9_-]{1,24}$/.test(v),clamp=v=>Math.max(-50000,Math.min(50000,v));
 const ids=new Set(),comps=[];let maxN=0;const bump=id=>{maxN=Math.max(maxN,parseInt(id.replace(/\D/g,''),10)||0)};
 for(const c of e.comps){
  if(!c||typeof c!=='object'||typeof c.type!=='string'||!Object.prototype.hasOwnProperty.call(DEFS,c.type))throw new Error('O arquivo tem um componente desconhecido'+(c&&typeof c.type==='string'?' ("'+c.type.slice(0,30)+'")':'')+'. Ele pode ter sido criado numa versão mais nova.');
  if(!idOk(c.id)||ids.has(c.id))throw new Error('O arquivo tem componentes com identificação inválida ou repetida.');
  ids.add(c.id);bump(c.id);
  const n={};for(const k of Object.keys(c)){if(!/^[A-Za-z][A-Za-z0-9_]{0,14}$/.test(k))continue;const v=c[k];
   if(num(v))n[k]=v;else if(typeof v==='boolean')n[k]=v;else if(typeof v==='string')n[k]=v.replace(/[\u0000-\u001f]/g,'').slice(0,1000)}
  const r=num(n.r)?((Math.round(n.r/90)*90%360)+360)%360:0;
  comps.push({...JSON.parse(JSON.stringify(DEFS[c.type].def||{})),...n,id:c.id,type:c.type,x:num(n.x)?clamp(n.x):0,y:num(n.y)?clamp(n.y):0,r,tag:typeof n.tag==='string'?n.tag:''})}
 const wires=[],wid=new Set();let dropped=0;
 for(const w of e.wires){
  const ok=w&&typeof w==='object'&&idOk(w.id)&&!wid.has(w.id)&&w.a&&w.b&&ids.has(w.a.c)&&ids.has(w.b.c)&&Number.isInteger(w.a.t)&&Number.isInteger(w.b.t)&&w.a.t>=0&&w.b.t>=0&&w.a.t<64&&w.b.t<64;
  if(!ok){dropped++;continue}wid.add(w.id);bump(w.id);
  const nw={id:w.id,a:{c:w.a.c,t:w.a.t},b:{c:w.b.c,t:w.b.t}};
  if((w.o==='v'||w.o==='h')&&num(w.m)){nw.o=w.o;nw.m=clamp(w.m)}
  if(w.flt==='open')nw.flt='open';
  if(typeof w.col==='string'&&WCOL[w.col])nw.col=w.col;
  wires.push(nw)}
 const st={comps,wires,seq:Math.max(num(e.seq)?Math.floor(e.seq):1,maxN+1)};
 if(Array.isArray(e.sheets)){const sh=e.sheets.filter(x=>x&&num(x.id)&&x.id>=1&&x.id<1000).slice(0,60).map(x=>({id:Math.floor(x.id),name:typeof x.name==='string'?x.name.replace(/[\u0000-\u001f]/g,'').slice(0,40):'Folha'}));if(sh.length){st.sheets=sh;st.cur=sh.some(x=>x.id===e.cur)?e.cur:sh[0].id}}
 if(e.doc&&typeof e.doc==='object'){const d={};for(const k of['wn','xr','fr'])if(typeof e.doc[k]==='boolean')d[k]=e.doc[k];for(const k of['titulo','cliente','autor','numero','rev','data','obs'])if(typeof e.doc[k]==='string')d[k]=e.doc[k].replace(/[\u0000-\u001f]/g,'').slice(0,120);st.doc=d}
 if(e.train&&typeof e.train==='object'){const t=e.train;st.train={on:!!t.on,mode:t.mode==='aluno'?'aluno':'prof',pin:typeof t.pin==='string'?t.pin.slice(0,8):'',tries:num(t.tries)?Math.max(0,Math.floor(t.tries)):0,found:Array.isArray(t.found)?t.found.filter(x=>typeof x==='string').slice(0,200):[]}}
 Object.defineProperty(st,'dropped',{value:dropped,enumerable:false});return st}

function parseFais(txt){
 let o;try{o=JSON.parse(txt)}catch(e){throw new Error('Não consegui ler este arquivo: ele não é um esquema do Faísca.')}
 if(!o||typeof o!=='object'||o.formato!=='faisca')throw new Error('Este arquivo não parece ser um esquema do Faísca (.fais).');
 if(!(o.versao>=1)||o.versao>FAIS_V)throw new Error('Este arquivo foi salvo por uma versão mais nova do Faísca e não pode ser aberto aqui.');
 return cleanState(o.esquema)}

async function openFile(f){
 if(mode==='sim'){toast('Pare a simulação antes de abrir um esquema.',true);return}
 if(f.size>8e6){toast('Este arquivo é grande demais para ser um esquema do Faísca.',true);return}
 let st;try{st=parseFais(await f.text())}catch(err){toast(err.message,true);return}
 const nome=cleanName(f.name.replace(/\.[^.]+$/,''))||'Esquema importado';
 createProj(nome,st);
 toast(`"${meta(IDX.cur).nome}" aberto como projeto novo: ${S.comps.length} componente(s) e ${S.wires.length} fio(s).`+(st.dropped?` ${st.dropped} fio(s) inválido(s) foram ignorados.`:''))}

/* ================= projetos guardados no navegador ================= */
/* 'faisca-idx' guarda a lista; cada projeto fica em 'faisca-p-<id>'. Se o navegador recusar gravar, os dados ficam só na memória da aba. */
const MEM=new Map(),PK='faisca-p-',IK='faisca-idx';let warned=false;
const LS={
 get(k){if(MEM.has(k))return MEM.get(k);try{return localStorage.getItem(k)}catch(e){return null}},
 set(k,v){try{localStorage.setItem(k,v);MEM.delete(k);return true}catch(e){MEM.set(k,v);return false}},
 del(k){MEM.delete(k);try{localStorage.removeItem(k)}catch(e){}}};
let IDX={v:1,cur:null,list:[]};
function persistWarn(ok){if(!ok&&!warned){warned=true;toast('O navegador não deixou salvar (sem espaço ou bloqueado). Use Salvar .fais para não perder o trabalho.',true)}}
function idxSave(){persistWarn(LS.set(IK,JSON.stringify(IDX)))}
function idxLoad(){const t=LS.get(IK);if(!t)return null;
 try{const o=JSON.parse(t);if(!o||!Array.isArray(o.list)||typeof o.cur!=='string')return null;
  const list=o.list.filter(p=>p&&typeof p.id==='string'&&/^[A-Za-z0-9_-]{1,40}$/.test(p.id)&&typeof p.nome==='string').map(p=>({id:p.id,nome:cleanName(p.nome)||'Sem título',mod:num(p.mod)?p.mod:0,n:num(p.n)?p.n:0}));
  if(!list.length)return null;return{v:1,cur:list.some(p=>p.id===o.cur)?o.cur:list[0].id,list}}catch(e){return null}}
const meta=id=>IDX.list.find(p=>p.id===id);
const newPid=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function uniqueName(base,exceptId){base=cleanName(base)||'Sem título';const used=new Set(IDX.list.filter(p=>p.id!==exceptId).map(p=>p.nome.toLowerCase()));
 if(!used.has(base.toLowerCase()))return base;let n=2,nm;while(used.has((nm=`${base} (${n})`).toLowerCase()))n++;return nm}
function loadProj(id){const t=LS.get(PK+id);if(!t)return null;try{return cleanState(JSON.parse(t))}catch(e){return null}}
/* autosave do projeto atual: chamado a cada alteração */
function save(){
 let m=meta(IDX.cur);if(!m){m={id:IDX.cur,nome:uniqueName('Sem título'),mod:0,n:0};IDX.list.push(m)}
 persistWarn(LS.set(PK+IDX.cur,JSON.stringify(S)));m.mod=Date.now();m.n=S.comps.length;idxSave()}
function updChip(){const m=meta(IDX.cur),c=$('#pchip');if(!c)return;c.textContent=m?m.nome:'';c.title='Projeto atual: '+(m?m.nome:'')+' (clique para trocar ou criar projetos)'}
function setProj(id,st){IDX.cur=id;S=st;hist=[];fut=[];sel=null;tool=null;const m=meta(id);fname=m?m.nome:'esquema-faisca';commit();requestAnimationFrame(fit);updChip()}
function addProj(nome,st){const id=newPid();IDX.list.push({id,nome:uniqueName(nome),mod:Date.now(),n:st.comps.length});persistWarn(LS.set(PK+id,JSON.stringify(st)));return id}
function createProj(nome,st){save();const id=addProj(nome,st);setProj(id,st);return id}
function switchProj(id){if(id===IDX.cur)return true;const st=loadProj(id);if(!st){toast('Não consegui abrir este projeto: os dados dele estão ausentes ou corrompidos.',true);return false}save();setProj(id,st);return true}
function renameProj(id,nome){const m=meta(id);if(!m)return;m.nome=uniqueName(nome,id);idxSave();if(id===IDX.cur){fname=m.nome;updChip()}}
function dupProj(id){const m=meta(id),st=id===IDX.cur?JSON.parse(JSON.stringify(S)):loadProj(id);if(!m||!st){toast('Não consegui duplicar este projeto.',true);return false}addProj(m.nome+' (cópia)',st);idxSave();return true}
function deleteProj(id){const i=IDX.list.findIndex(p=>p.id===id);if(i<0)return;const wasCur=id===IDX.cur;LS.del(PK+id);IDX.list.splice(i,1);
 if(wasCur){let st=null,nid=null;for(const p of IDX.list.slice().sort((a,b)=>b.mod-a.mod)){st=loadProj(p.id);if(st){nid=p.id;break}}
  if(!nid){st={comps:[],wires:[],seq:1};nid=addProj('Sem título',st)}
  setProj(nid,st)}else idxSave()}
function initProjects(){
 const idx=idxLoad();
 if(idx){IDX=idx;for(const id of [idx.cur,...idx.list.map(p=>p.id)]){const st=loadProj(id);if(st){setProj(id,st);return}}
  toast('Não consegui recuperar seus projetos salvos; comecei um novo.',true)}
 /* primeira vez: traz o esquema da versão antiga, se houver */
 let st=null;const old=LS.get('faisca-v2');if(old){try{st=cleanState(JSON.parse(old))}catch(e){}}
 if(st){setProj(addProj('Meu esquema',st),st);return}
 const id=addProj('Partida direta',{comps:[],wires:[],seq:1});
 IDX.cur=id;S={comps:[],wires:[],seq:1};hist=[];fut=[];fname='Partida direta';updChip();loadTpl('direta',true)}

/* janela "Projetos" */
const dlg=$('#dProj');
function fmtDate(t){if(!t)return'—';const d=new Date(t);return d.toDateString()===new Date().toDateString()?'hoje às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})}
function renderProj(){$('#plist').innerHTML=IDX.list.slice().sort((a,b)=>b.mod-a.mod).map(p=>{const cur=p.id===IDX.cur;
 return`<li data-id="${esc(p.id)}" class="${cur?'cur':''}"><input class="pn" value="${esc(p.nome)}" maxlength="60" aria-label="Nome do projeto" spellcheck="false"><span class="pa"><button data-a="open" ${cur?'disabled':''}>${cur?'Aberto':'Abrir'}</button><button data-a="dup">Duplicar</button><button data-a="del" class="danger">Excluir</button></span><small>${p.n} componente(s) · último uso ${fmtDate(p.mod)}</small></li>`}).join('')}
function openProj(){if(mode==='sim'){toast('Pare a simulação para trocar de projeto.',true);return}save();renderProj();$('#pnew').value='';typeof dlg.showModal==='function'?dlg.showModal():dlg.setAttribute('open','')}

$('#bProj').onclick=openProj;$('#pchip').onclick=openProj;$('#dpX').onclick=closeProj;

$('#pnew').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#pmk').click()}});

 if(a==='open'){if(switchProj(id)){closeProj();toast(`Projeto "${meta(id).nome}" aberto.`)}}

$('#plist').addEventListener('change',e=>{if(!e.target.classList.contains('pn'))return;const id=e.target.closest('li').dataset.id;renameProj(id,e.target.value);const m=meta(id);if(m)e.target.value=m.nome});
addEventListener('storage',e=>{if(e.key!==IK)return;const n=idxLoad();if(n){IDX.list=n.list;if(dlg.open)renderProj()}});

/* ================= copiar, colar e duplicar ================= */
let clip=null;
function extractSel(){if(!sel||!sel.c.size)return null;const cs=[...sel.c].map(byId).filter(Boolean);if(!cs.length)return null;
 const ids=new Set(cs.map(c=>c.id)),ws=S.wires.filter(w=>ids.has(w.a.c)&&ids.has(w.b.c));
 return{comps:JSON.parse(JSON.stringify(cs)),wires:JSON.parse(JSON.stringify(ws))}}
function copySel(quiet){const d=extractSel();if(!d){toast('Selecione um ou mais componentes para copiar.',true);return false}
 clip={...d,n:0,src:S.cur};if(!quiet)toast(`Copiado: ${d.comps.length} componente(s) e ${d.wires.length} fio(s). Use Ctrl+V para colar.`);renderProps();return true}
function cutSel(){if(mode!=='edit'||!copySel(true))return;delSel();toast('Recortado. Use Ctrl+V para colar.')}
/* cola uma cópia deslocada de (dx,dy). Bobinas e outros itens com identificação própria ganham número novo
   (K1 vira K2); os contatos colados junto passam a seguir a nova bobina; referências como "A1+" também acompanham. */
function pasteData(d,dx,dy){
 pushHist();
 const tmap={},idmap={},nc=[],olds=[];
 for(const o of d.comps){const c=JSON.parse(JSON.stringify(o));idmap[o.id]=c.id='c'+(S.seq++);c.x+=dx;c.y+=dy;olds.push(c.tag);nc.push(c)}
 nc.forEach(c=>{if(ownOf(c))c.tag=''});
 nc.forEach(c=>{c.sh=S.cur||1;S.comps.push(c)});
 nc.forEach((c,i)=>{const pre=ownOf(c);if(pre){const t0=olds[i],busy=!t0||S.comps.some(o=>!nc.includes(o)&&ownOf(o)&&o.tag===t0)||nc.slice(0,i).some(o=>o.tag===t0);c.tag=busy?nextTag(pre):t0;if(olds[i]&&!(olds[i] in tmap))tmap[olds[i]]=c.tag}});
 nc.forEach(c=>{if(!ownOf(c)&&c.tag&&tmap[c.tag])c.tag=tmap[c.tag];
  ['by','sy','sy2'].forEach(k=>{if(typeof c[k]==='string'&&c[k]){const m=c[k].match(/^(.*?)([+\-−]?)$/);if(m&&m[1]&&tmap[m[1]])c[k]=tmap[m[1]]+m[2]}})});
 const nw=[];for(const o of d.wires){const w=JSON.parse(JSON.stringify(o));if(!idmap[w.a.c]||!idmap[w.b.c])continue;w.id='w'+(S.seq++);w.a.c=idmap[w.a.c];w.b.c=idmap[w.b.c];if(num(w.m))w.m+=w.o==='v'?dy:dx;nw.push(w)}
 S.wires.push(...nw);tool=null;sel=mkSel(nc.map(c=>c.id),nw.map(w=>w.id));commit();return{c:nc.length,w:nw.length}}
function pasteClip(){if(mode!=='edit')return;if(!clip){toast('Nada copiado ainda. Selecione componentes e aperte Ctrl+C.',true);return}
 clip.n++;const po=pasteOffset(clip),off=2*G*clip.n,r=po?pasteData(clip,po.dx+off-2*G,po.dy+off-2*G):pasteData(clip,off,off);toast(`Colado: ${r.c} componente(s) e ${r.w} fio(s).`)}
function dupSel(){if(mode!=='edit')return;const d=extractSel();if(!d){toast('Selecione um ou mais componentes para duplicar.',true);return}
 const r=pasteData(d,2*G,2*G);toast(`Duplicado: ${r.c} componente(s) e ${r.w} fio(s).`)}

/* ================= trajeto dos fios ================= */
/* Um fio tem 3 trechos. Sem ajuste, o programa escolhe sozinho. Com ajuste, w.o diz como o fio sai
   ('v' = sai na vertical e o trecho do meio é horizontal, em y = w.m; 'h' = o contrário, em x = w.m). */
function wmode(p,q,w){
 if(w&&(w.o==='v'||w.o==='h')&&Number.isFinite(w.m))return{o:w.o,m:w.m,custom:true};
 if(p.x===q.x||p.y===q.y)return{straight:true};
 return Math.abs(q.y-p.y)>=Math.abs(q.x-p.x)?{o:'v',m:snap((p.y+q.y)/2)}:{o:'h',m:snap((p.x+q.x)/2)}}
function wpts(p,q,w){const r=wmode(p,q,w);if(r.straight)return[p,q];return r.o==='v'?[p,{x:p.x,y:r.m},{x:q.x,y:r.m},q]:[p,{x:r.m,y:p.y},{x:r.m,y:q.y},q]}
function wpath(p,q,w){const r=wmode(p,q,w);if(r.straight)return`M${p.x},${p.y}L${q.x},${q.y}`;return r.o==='v'?`M${p.x},${p.y}V${r.m}H${q.x}V${q.y}`:`M${p.x},${p.y}H${r.m}V${q.y}H${q.x}`}
/* alça no meio do fio selecionado: arrastar muda o trajeto */
function whandle(w){const a=byId(w.a.c),b=byId(w.b.c);if(!a||!b)return null;const p=tp(a,w.a.t),q=tp(b,w.b.t),r=wmode(p,q,w);
 if(r.straight)return p.x===q.x?{x:p.x,y:(p.y+q.y)/2,o:'h'}:{x:(p.x+q.x)/2,y:p.y,o:'v'};
 return r.o==='v'?{x:(p.x+q.x)/2,y:r.m,o:'v'}:{x:r.m,y:(p.y+q.y)/2,o:'h'}}
const selWire=()=>sel&&sel.w.size===1&&!sel.c.size?S.wires.find(x=>x.id===[...sel.w][0]):null;
function flipWire(){const w=selWire();if(!w||mode!=='edit')return;const a=byId(w.a.c),b=byId(w.b.c);if(!a||!b)return;const p=tp(a,w.a.t),q=tp(b,w.b.t);if(p.x===q.x||p.y===q.y)return;
 const o=wmode(p,q,w).o==='v'?'h':'v';pushHist();w.o=o;w.m=o==='v'?snap((p.y+q.y)/2):snap((p.x+q.x)/2);commit()}
function resetWire(){const w=selWire();if(!w||!w.o||mode!=='edit')return;pushHist();delete w.o;delete w.m;commit()}
/* desvio automático: só mexe em fios cujo trajeto atravessa algum componente */
function segHits(a,b,r){if(a.y===b.y)return a.y>r[1]&&a.y<r[3]&&Math.max(a.x,b.x)>r[0]&&Math.min(a.x,b.x)<r[2];
 if(a.x===b.x)return a.x>r[0]&&a.x<r[2]&&Math.max(a.y,b.y)>r[1]&&Math.min(a.y,b.y)<r[3];return false}
function routeHits(pts,obs){for(let i=0;i<pts.length-1;i++)for(const r of obs)if(segHits(pts[i],pts[i+1],r))return true;return false}
/* caixas que um fio não deve atravessar: os outros componentes (com etiqueta e folga de 4) e, só pelo corpo, os dois

function autoJoin(newIds){if(!newIds.size)return 0;let n=0;
 for(let k=0;k<6;k++){const lc=looseConnIssues().filter(x=>x.c.type==='junction'&&(newIds.has(x.w.id)||S.wires.some(w=>newIds.has(w.id)&&(w.a.c===x.c.id||w.b.c===x.c.id))));if(!lc.length)break;
  const x=lc[0];if(!S.wires.includes(x.w))break;const q=tp(x.c,x.i),e=splitWire(x.w.id,q);if(!e)break;
  S.wires.forEach(w=>{if(w.a.c===e.c||w.b.c===e.c)newIds.add(w.id)});
  if(!(e.c===x.c.id&&e.t===x.i)){const w=newWire(e,{c:x.c.id,t:x.i});S.wires.push(w);newIds.add(w.id)}
  /* o ponto criado pela divisão coincide com a curva: junta os dois num só */
  const jx=byId(e.c);if(jx&&jx.type==='junction'&&jx.id!==x.c.id&&Math.hypot(jx.x-x.c.x,jx.y-x.c.y)<1){S.wires.forEach(w=>{if(w.a.c===jx.id)w.a={c:x.c.id,t:0};if(w.b.c===jx.id)w.b={c:x.c.id,t:0}});
   S.wires=S.wires.filter(w=>!(w.a.c===w.b.c&&w.a.t===w.b.t));S.comps=S.comps.filter(c=>c!==jx)}
  n++}
 /* trechos repetidos entre os mesmos dois pontos (fio por cima de fio) viram um só */
 if(n){const seen=new Set();S.wires=S.wires.filter(w=>{const k=[w.a.c+':'+w.a.t,w.b.c+':'+w.b.t].sort().join('|');if(seen.has(k))return false;seen.add(k);return true})}
 return n}
