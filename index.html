<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="author" content="Thiagosystems">
<meta name="theme-color" content="#f2b705">
<meta name="description" content="Faísca: simulador de comandos elétricos, eletrônica, CLP e pneumática. Feito por Thiagosystems.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faísca — simulador de comandos elétricos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6ebf1;--panel:#f7f9fb;--panel2:#eef2f6;--ink:#1b2a41;--muted:#5d6b80;--line:#cdd5df;--wire:#34445c;--gdot:#bcc6d2;--stage:#f2f5f8;--pick:#1668c9;--energy:#f2b705;--energy-ink:#241b00;--ok:#1a8754;--err:#d7263d;--warn:#c77700;--info:#1668c9;--air:#16a3b5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1520;--panel:#121c29;--panel2:#172333;--ink:#dfe6ef;--muted:#8b99ad;--line:#243246;--wire:#9fb0c6;--gdot:#223044;--stage:#0f1824;--pick:#5aa2ff;--energy:#ffcf1f;--energy-ink:#241b00;--ok:#4cc38a;--err:#ff5d6c;--warn:#ffae33;--info:#5aa2ff;--air:#3fd0e0}}
:root[data-theme="dark"]{--bg:#0d1520;--panel:#121c29;--panel2:#172333;--ink:#dfe6ef;--muted:#8b99ad;--line:#243246;--wire:#9fb0c6;--gdot:#223044;--stage:#0f1824;--pick:#5aa2ff;--energy:#ffcf1f;--energy-ink:#241b00;--ok:#4cc38a;--err:#ff5d6c;--warn:#ffae33;--info:#5aa2ff;--air:#3fd0e0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--pick);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto}
.logo{width:28px;height:28px;border-radius:7px;background:var(--energy);color:var(--energy-ink);display:grid;place-items:center}
.brand b{font-size:17px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12.5px}
.bt{display:flex;align-items:baseline;gap:9px}
.by{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 9px;white-space:nowrap}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tools button,.tools select{height:32px;padding:0 11px;border:1px solid var(--line);background:var(--panel2);border-radius:7px;cursor:pointer}
.tools button:hover,.tools select:hover{border-color:var(--muted)}
.tools .primary{background:var(--energy);color:var(--energy-ink);border-color:transparent;font-weight:600;min-width:98px}
body.sim .tools .primary{background:var(--err);color:#fff}
.tools .toggle.on{border-color:var(--pick);color:var(--pick);font-weight:600}
.tools select{max-width:170px}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
main{flex:1;min-height:0;display:grid;grid-template-columns:230px minmax(0,1fr) 340px}
.palette{overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:10px 10px 16px}
.psearch{width:100%;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:0 9px;margin-bottom:6px}
.palette details{border-bottom:1px solid var(--line);padding:4px 0}
.palette summary{cursor:pointer;font-size:12.5px;font-weight:600;padding:6px 2px;list-style:none;display:flex;justify-content:space-between;color:var(--ink)}
.palette summary::-webkit-details-marker{display:none}
.palette summary small{color:var(--muted);font-weight:400}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px 0 8px}
.pitem{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer;min-height:84px}
.pitem:hover{border-color:var(--muted)}
.pitem.on{border-color:var(--pick);box-shadow:0 0 0 2px color-mix(in srgb,var(--pick) 25%,transparent)}
.pitem svg{width:48px;height:44px;overflow:visible}
.pitem svg:not(.pbico) :is(line,path,rect,circle,ellipse,polygon){stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round}
.pitem svg:not(.pbico) .dot,.pitem svg:not(.pbico) .fillink{fill:var(--ink)}
.pitem svg:not(.pbico) .dash{stroke-dasharray:6 5;stroke-width:2}
.pitem svg:not(.pbico) text{fill:var(--ink);stroke:none;font:600 13px 'IBM Plex Mono',monospace;text-anchor:middle}
.pitem svg:not(.pbico) .tn,.pitem svg:not(.pbico) .tn6,.pitem svg:not(.pbico) .tag{display:none}
.pitem span{font-size:10.5px;line-height:1.2;text-align:center;color:var(--muted)}
body.sim .palette{opacity:.45;pointer-events:none}
.stage{position:relative;min-width:0;background:var(--stage)}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.gdot{fill:var(--gdot)}
#world .comp :is(line,path,rect,circle,ellipse,polygon){stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
#world .comp .hit{fill:transparent;stroke:none}
#world .comp.sel .hit{fill:color-mix(in srgb,var(--pick) 9%,transparent);stroke:var(--pick);stroke-width:1;stroke-dasharray:4 3}
#world .comp .dash{stroke-dasharray:4 3;stroke-width:1.3}
#world .comp .thick{stroke-width:4}
#world .comp .fillink,#world .comp .dot{fill:var(--ink)}
#world .comp .box{fill:var(--panel)}
#world .comp .on{stroke:var(--ok);stroke-width:2.6}
#world .comp .en{fill:color-mix(in srgb,var(--energy) 55%,transparent)}
#world .comp .pos{fill:color-mix(in srgb,var(--air) 22%,transparent)}
#world .comp .air{stroke:var(--air)}
#world .comp .blown{fill:var(--err);stroke:var(--err)}
#world .comp .trip,#world .comp .warnf{stroke:var(--err);stroke-dasharray:5 3}
#world .comp .srcc{fill:var(--panel);stroke-width:2.6}
#world .comp .spin{stroke:var(--energy);stroke-dasharray:10 9;stroke-width:2.6;transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
#world .comp .spin.ccw{animation-direction:reverse}
#world .comp .wave{stroke:var(--energy);animation:blink .35s infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
#world .comp .term{fill:var(--panel);stroke:var(--pick);stroke-width:1.6;cursor:crosshair}
#world .comp .term:hover{fill:var(--pick)}
#world text{stroke:none;fill:var(--ink);font-family:'IBM Plex Mono',ui-monospace,monospace}
#world .tn{font-size:8.5px;fill:var(--muted)}
#world .tn6{font-size:6.5px;fill:var(--muted);text-anchor:middle}
#world .tag{font:600 12px 'IBM Plex Sans',system-ui,sans-serif}
#world .lv{font-size:10px;font-weight:600;text-anchor:middle}
#world .ctr{text-anchor:middle}
#world .srct{font-size:10px;font-weight:600;text-anchor:middle}
#world .mt{font-size:16px;font-weight:600;text-anchor:middle}
#world .ms{font-size:10px;text-anchor:middle}
#world .note{font:500 13px 'IBM Plex Sans',sans-serif}
.wire{fill:none;stroke:var(--wire);stroke-width:2;stroke-linejoin:round;pointer-events:none}
.wire.live{stroke-width:3.2}
.wire.sel{stroke:var(--pick);stroke-width:3}
.wire.short{stroke:var(--err);stroke-width:3.2;stroke-dasharray:7 5;animation:march .6s linear infinite}
@keyframes march{to{stroke-dashoffset:-24}}
.whit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}
body.sim .whit{cursor:grab}
body.sim .comp.actv{cursor:pointer}
body.sim .comp.actv:hover .hit{fill:color-mix(in srgb,var(--energy) 16%,transparent)}
#oL{pointer-events:none}
.ghost{opacity:.55}
.ghost :is(line,path,rect,circle,ellipse,polygon){stroke:var(--pick);stroke-width:2;fill:none}
.ghost text{display:none}
.selbox{fill:color-mix(in srgb,var(--pick) 8%,transparent);stroke:var(--pick);stroke-width:1;stroke-dasharray:5 4}
#world .rd{font:500 9.5px 'IBM Plex Mono',monospace;fill:var(--muted)}
#world .rd.live{fill:var(--pick);font-weight:600}
#world .rd.bad{fill:var(--err);font-weight:700}
#world .burnx line{stroke:var(--err)!important;stroke-width:3!important}
.tsec{border-top:1px dashed var(--line);margin-top:12px;padding-top:4px}.tsec h4{margin:6px 0;font-size:12.5px}.tsec.ok h4{color:var(--ok)}
.tlist{margin:4px 0 8px;padding-left:18px;font-size:12px}
.mread{font:600 22px 'IBM Plex Mono',monospace;background:#0d1b14;color:#7CFC9A;border-radius:8px;padding:8px 12px;margin-top:8px;text-align:right}
#train .row button.on{border-color:var(--pick);color:var(--pick);font-weight:600}
.tmark circle{stroke:var(--stage);stroke-width:2}.tmark.tp circle{fill:var(--warn)}.tmark.tf circle{fill:var(--ok)}
#world .tmark text,#world .probe text{fill:#fff;font:700 11px 'IBM Plex Sans',sans-serif;text-anchor:middle}
.probe circle{stroke:#fff;stroke-width:2}.probe.pr circle{fill:#e23d3d}.probe.pb circle{fill:#222}#world .probe text{fill:var(--ink);font-size:13px}
.pread rect{fill:#0d1b14;stroke:#7CFC9A}#world .pread text{fill:#7CFC9A;font:600 12px 'IBM Plex Mono',monospace}
.stabs{cursor:move;user-select:none}
.meas .row button{font-size:12px}
#scope{position:absolute;right:12px;bottom:34px;width:410px;max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px 10px 10px;z-index:3}
#scope[hidden]{display:none}
.stabs{display:flex;align-items:center;gap:6px;margin-bottom:6px}.stabs b{font-size:13px;margin-right:auto}
.stabs button{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer}.stabs button.on{border-color:var(--pick);color:var(--pick);font-weight:600}
.ssvg{width:100%;height:auto;display:block;background:#0d1b14;border-radius:6px}
.ssvg .sg{stroke:#ffffff1c;stroke-width:1}.ssvg .s0{stroke:#ffffff45}.ssvg .tr{fill:none;stroke-width:2;stroke-linejoin:round}
.shead{font-size:11.5px;color:var(--muted);margin:6px 0 3px}.sinfo{font:500 11.5px/1.5 'IBM Plex Mono',monospace;color:var(--ink);margin-top:6px}
.meas h4{margin:12px 0 6px;font-size:12.5px}
.mtab{width:100%;border-collapse:collapse;font-size:12.5px}
.mtab td{padding:4px 0;border-bottom:1px dashed var(--line)}
.mtab td:last-child{text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:600}
.meas-bad{color:var(--err);font-size:12px;font-weight:600;margin:6px 0 0}
.wprev{fill:none;stroke:var(--pick);stroke-width:2;stroke-dasharray:5 4}
.wstart{fill:var(--pick)}
.badge circle{stroke:var(--stage);stroke-width:2}
.badge.erro circle{fill:var(--err)}.badge.aviso circle{fill:var(--warn)}
#world .badge text{fill:#fff;font:700 11px 'IBM Plex Sans',sans-serif;text-anchor:middle}
.flash{fill:none;stroke:var(--err);stroke-width:2.5;animation:blink .45s ease-in-out 4 alternate}
@keyframes blink{from{opacity:1}to{opacity:.15}}
#banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:var(--err);color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 24px);flex-wrap:wrap;z-index:2}
#banner[hidden]{display:none}
#banner span{font-size:13px;opacity:.95}
#banner button{background:#fff;color:#a3122a;border:0;border-radius:6px;padding:6px 12px;font-weight:600;cursor:pointer}
.simtag{position:absolute;top:12px;left:12px;display:none;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:12px;font-weight:600}
.simtag::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--energy);animation:blink .8s infinite alternate}
body.sim .simtag{display:flex}
.simspd{position:absolute;top:48px;left:130px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px}.simspd[hidden]{display:none}.simspd select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:1px 4px}.simspd .spdt{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px}
#toast{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 24px);z-index:5;text-align:center}
#toast[hidden]{display:none}#toast.err{background:var(--err);color:#fff}
.wh .whc{fill:var(--panel);stroke:var(--pick);stroke-width:2.5}
.wh:hover .whc{fill:var(--pick)}
.pchip{position:absolute;top:12px;right:12px;max-width:min(260px,45%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}
.pchip::before{content:'Projeto: ';font-weight:400;color:var(--muted)}
.pchip:hover{border-color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:0 24px 70px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(8,14,24,.55)}
.dlg{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:16px}.dlg>p{margin:0}
.dlg button{height:32px;padding:0 11px;border:1px solid var(--line);background:var(--panel2);border-radius:7px;cursor:pointer}
.dlg button:hover:not(:disabled){border-color:var(--muted)}
.dlg button.primary{background:var(--energy);color:var(--energy-ink);border-color:transparent;font-weight:600}
.dlg button.danger{color:var(--err)}
.prow{display:flex;gap:8px}
.prow input{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:0 9px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:52vh}
.plist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.plist li.cur{border-color:var(--pick);box-shadow:0 0 0 2px color-mix(in srgb,var(--pick) 22%,transparent)}
.plist .pn{height:30px;border:1px solid transparent;background:transparent;border-radius:6px;padding:0 6px;font-weight:600;min-width:0}
.plist .pn:hover,.plist .pn:focus{border-color:var(--line);background:var(--panel)}
.plist small{grid-column:1;color:var(--muted);font-size:12px;padding-left:6px}
.plist .pa{grid-column:2;grid-row:1 / span 2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.plist li{grid-template-columns:1fr}.plist .pa{grid-column:1;grid-row:auto;justify-content:flex-start}}
#hint{position:absolute;left:12px;bottom:10px;right:12px;font-size:12px;color:var(--muted);pointer-events:none;text-shadow:0 0 5px var(--stage)}
.side{overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h3{margin:0 0 8px;font-size:14px}
.card label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);margin:8px 0}
.card label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.card input,.card select,.card textarea{height:32px;border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:0 8px;color:var(--ink);font-family:'IBM Plex Mono',monospace}
.card label.chk input{height:auto}
.row{display:flex;gap:6px;margin-top:10px}
.row button{flex:1;height:32px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
.row .danger{color:var(--err)}
button:disabled,input:disabled,select:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}.small{font-size:12px}
.help{padding-left:18px;margin:0;font-size:13px;line-height:1.45}.help li{margin:4px 0}
kbd{font-family:'IBM Plex Mono',monospace;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--panel)}
.keys{font-size:12px;color:var(--muted);line-height:2.1;margin:10px 0 0}
.dhead{display:flex;align-items:center;justify-content:space-between}
.dhead h3{margin:0}
#dstate{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
body.sim #dstate::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--energy);animation:blink .8s infinite alternate}
.tabs{display:flex;gap:3px;margin:10px 0;background:var(--panel);padding:3px;border-radius:9px;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.tabs button.on{background:var(--panel2);color:var(--ink);font-weight:600}
#pc{font-size:10.5px;padding:0 6px;border-radius:10px;margin-left:4px;font-weight:700}
#pc.e{background:var(--err);color:#fff}#pc.a{background:var(--warn);color:#1a1200}#pc:empty{display:none}
.nar{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.nar li{padding:8px 10px 8px 27px;position:relative;background:var(--panel);border-radius:8px;border:1px solid var(--line);font-size:13px}
.nar li::before{content:'';position:absolute;left:11px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.nar li.on::before{background:var(--energy);box-shadow:0 0 0 2px color-mix(in srgb,var(--energy) 30%,transparent)}
.nar li.e::before{background:var(--err)}.nar li.w::before{background:var(--warn)}.nar li.a::before,.nar li.m::before{background:var(--info)}.nar li.ok::before{background:var(--ok)}.nar li.p::before{background:var(--air)}
.iss{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--muted);background:var(--panel);border-radius:8px;padding:9px 10px;margin-bottom:7px;cursor:pointer}
.iss:hover{border-color:var(--muted)}
.iss.erro{border-left-color:var(--err)}.iss.aviso{border-left-color:var(--warn)}.iss.info{border-left-color:var(--info)}
.iss b{display:block;font-size:13px;margin:2px 0 3px}
.iss small{color:var(--muted);font-size:12px;line-height:1.45;display:block}
.chip{font-size:11px;font-weight:600}
.iss.erro .chip{color:var(--err)}.iss.aviso .chip{color:var(--warn)}.iss.info .chip{color:var(--info)}
.okmsg{color:var(--ok);font-weight:600}
.log{list-style:none;padding:0;margin:0;font-size:12.5px}
.log li{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.log time{font-family:'IBM Plex Mono',monospace;color:var(--muted);min-width:42px}
.log li.on{color:var(--ok)}.log li.e{color:var(--err);font-weight:600}.log li.off{color:var(--muted)}
#diag[hidden]{display:none}
@media (max-width:1600px){.bt span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:900px){
 html,body{height:auto}body{overflow:auto}
 main{display:flex;flex-direction:column}
 .palette{border-right:0;border-bottom:1px solid var(--line);max-height:40vh}
 .pgrid{grid-template-columns:repeat(4,1fr)}
 .stage{height:62vh}
 .side{border-left:0;overflow:visible}
 .brand span{display:none}
}

/* ---- barra de ferramentas organizada em grupos ---- */
.top{flex-wrap:nowrap;gap:14px}
.brand{margin-right:0;flex:none}
.tools{flex:1;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grp{display:flex;align-items:center;gap:6px}
.seg{gap:0;border:1px solid var(--line);border-radius:8px;background:var(--panel2);overflow:hidden}
.tools .seg>button{height:32px;border:0;border-radius:0;background:transparent;border-right:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;padding:0 11px}
.tools .seg>button:last-child{border-right:0}

<script>/* configurações e idioma (lidos antes de tudo) */
const CFG=(()=>{try{const o=JSON.parse(localStorage.getItem('faisca-cfg')||'{}');return o&&typeof o==='object'?o:{}}catch(e){return{}}})(),LANG=CFG.lang==='en'?'en':'pt',DEC=LANG==='en'?'.':',';

const G=20,EMPTY=new Set(),PH=['L1','L2','L3'],CW=['L1L2L3','L2L3L1','L3L1L2'];

let S={comps:[],wires:[],seq:1},mode='edit',tool=null,sel=null,diagOn=true,diagTab='agora',soundOn=true;

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const snap=v=>Math.round(v/G)*G,K=(id,i)=>id+':'+i,byId=id=>S.comps.find(c=>c.id===id);
const rng=n=>Array.from({length:n},(_,i)=>i),PX=p=>rng(p).map(i=>i*40-(p-1)*20);
const V2=[[0,-40],[0,40]],P3=[[-40,-40],[0,-40],[40,-40],[-40,40],[0,40],[40,40]];
const L=(a,b,c,d,cl)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"${cl?` class="${cl}"`:''}/>`;
const P=(d,cl,ex='')=>`<path d="${d}"${cl?` class="${cl}"`:''}${ex}/>`;
const R=(x,y,w,h,cl,ex='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}"${cl?` class="${cl}"`:''}${ex}/>`;
const C=(x,y,r,cl,ex='')=>`<circle cx="${x}" cy="${y}" r="${r}"${cl?` class="${cl}"`:''}${ex}/>`;
const T=(x,y,s,r,cl)=>`<text x="${x}" y="${y}" class="${cl||''}" transform="rotate(${-(r||0)} ${x} ${y})">${esc(s)}</text>`;

/* ---- potenciais: cada rótulo de fonte vira um "potencial" ---- */
function pot(l){if(l==='AR'||l==='ESC'||l==='LAD+'||l==='LAD0')return l;const i=l.lastIndexOf(':'),b=i<0?l:l.slice(i+1);
 if(b==='+')return'P';if(b==='-')return'Z';if(b==='N')return'N';if(b==='PE')return'PE';return l}
const isE=p=>p==='N'||p==='PE'||p==='Z',isPn=p=>p==='AR'||p==='ESC',isLad=p=>p==='LAD+'||p==='LAD0';
const phOf=l=>{const b=l.slice(l.lastIndexOf(':')+1);return PH.includes(b)?b:null};
const isHigh=p=>p==='P'||!!phOf(p)&&!isPn(p)&&!isLad(p),isLow=p=>p==='Z'||p==='N';
function col(l){if(!l)return'#888';return COL[l]||COL[pot(l)]||COL[phOf(l)]||'#3aa0a0'}
function energ(a,b){for(const x of a){const px=pot(x);if(isPn(px))continue;for(const y of b){const py=pot(y);if(px===py||isPn(py))continue;if(isE(px)&&isE(py))continue;if(isLad(px)!==isLad(py))continue;return true}}return false}
function conflict(s){const ps=[...new Set([...s].map(pot))].filter(p=>!isPn(p));for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){if(isE(ps[i])&&isE(ps[j]))continue;return[ps[i],ps[j]]}return null}
function phL(s){let r=null;for(const l of s){const p=pot(l);if(phOf(l)&&!isPn(p)){if(r&&pot(r)!==p)return null;r=l}}return r}
const hasPot=(s,p)=>[...s].some(l=>pot(l)===p);
function makeUF(){const p={},f=k=>{if(p[k]===undefined)p[k]=k;while(p[k]!==k){p[k]=p[p[k]];k=p[k]}return k};return{f,u:(a,b)=>{a=f(a);b=f(b);if(a!==b)p[a]=b}}}

function buildAdj(){const adj={},add=(a,b)=>{(adj[a]=adj[a]||[]).push(b)};S.wires.forEach(w=>{const a=K(w.a.c,w.a.t),b=K(w.b.c,w.b.t);add(a,b);add(b,a)});return adj}
function reach(adj,start){const out=[],seen=new Set([start]),q=[start];while(q.length){const k=q.shift();for(const n of adj[k]||[]){if(seen.has(n))continue;seen.add(n);const[id,ti]=n.split(':'),c=byId(id);if(!c)continue;if(c.type==='junction'){q.push(n);continue}out.push([c,+ti])}}return out}
const isStep=c=>c.type==='gstep'||c.type==='gmacro';
function gUp(adj,t){const res=[],seen=new Set(),go=k=>{for(const[c,i]of reach(adj,k)){const key=K(c.id,i);if(seen.has(key))continue;seen.add(key);
 if(isStep(c)&&i===1)res.push(c);else if((c.type==='gdivand'||c.type==='gdivor')&&i>=1)go(K(c.id,0));else if((c.type==='gconvand'||c.type==='gconvor')&&i===2){go(K(c.id,0));go(K(c.id,1))}}};go(K(t.id,0));return res}
function gDn(adj,t){const res=[],seen=new Set(),go=k=>{for(const[c,i]of reach(adj,k)){const key=K(c.id,i);if(seen.has(key))continue;seen.add(key);
 if(isStep(c)&&i===0)res.push(c);else if((c.type==='gdivand'||c.type==='gdivor')&&i===0){go(K(c.id,1));go(K(c.id,2))}else if((c.type==='gconvand'||c.type==='gconvor')&&i<=1)go(K(c.id,2))}};go(K(t.id,1));return res}
function grafTick(dt){const steps=S.comps.filter(isStep);if(!steps.length||!rt.E.lad)return false;
 steps.forEach(s=>{if(rt.gx[s.tag])rt.gt[s.tag]=(rt.gt[s.tag]||0)+dt});const fire=[];
 for(const t of S.comps.filter(c=>c.type==='gtrans')){const g=rt.gg[t.id];if(!g||!g.up.length||!g.dn.length)continue;if(g.up.every(s=>rt.gx[s.tag])&&evalExpr(t.cond,n=>getName(n,rt.E)))fire.push(g)}
 if(!fire.length)return false;fire.forEach(g=>g.up.forEach(s=>rt.gx[s.tag]=false));fire.forEach(g=>g.dn.forEach(s=>{rt.gx[s.tag]=true;rt.gt[s.tag]=0}));
 logE(`GRAFCET: ativou ${[...new Set(fire.flatMap(g=>g.dn.map(s=>s.tag)))].join(', ')}`,'on');return true}

function tick(){if(!rt||!rt.res)return;const K=simK(),dt=simDt();rt.dt=dt;
 for(let k=0;k<K;k++){let ch=false;for(const c of S.comps){const d=D(c);if(d.tick&&d.tick(c,dt))ch=true}if(grafTick(dt))ch=true;if(anTick(dt))ch=true;
  rt.simT=(rt.simT||0)+dt;if(motStart())ch=true;if(ch){solve();motStart()}sampleWave()}

function nearOnWire(w,p){const pts=wireGeo(w);if(!pts)return null;let best=null,bd=1e9;
 for(let i=0;i+1<pts.length;i++){const A=pts[i],B=pts[i+1],dx=B.x-A.x,dy=B.y-A.y,l2=dx*dx+dy*dy;let t=l2?((p.x-A.x)*dx+(p.y-A.y)*dy)/l2:0;t=Math.max(0,Math.min(1,t));
  let q={x:A.x+t*dx,y:A.y+t*dy};if(Math.abs(dy)<1e-6)q.x=Math.max(Math.min(A.x,B.x),Math.min(Math.max(A.x,B.x),snap(q.x)));else if(Math.abs(dx)<1e-6)q.y=Math.max(Math.min(A.y,B.y),Math.min(Math.max(A.y,B.y),snap(q.y)));
  const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;best=q}}return best}
function splitWire(wid,p){const w=S.wires.find(x=>x.id===wid);if(!w)return null;const q=nearOnWire(w,p);if(!q)return null;
 const a=byId(w.a.c),b=byId(w.b.c),P=tp(a,w.a.t),Q=tp(b,w.b.t);if(Math.hypot(q.x-P.x,q.y-P.y)<1)return w.a;if(Math.hypot(q.x-Q.x,q.y-Q.y)<1)return w.b;
 const j=placeComp(makeComp('junction',{}),Math.round(q.x*10)/10,Math.round(q.y*10)/10,0);S.comps.push(j);S.wires=S.wires.filter(x=>x!==w);
 const w1={id:'w'+(S.seq++),a:w.a,b:{c:j.id,t:0}},w2={id:'w'+(S.seq++),a:{c:j.id,t:0},b:w.b};if(w.col){w1.col=w.col;w2.col=w.col}if(w.flt){w1.flt=w.flt}S.wires.push(w1,w2);return{c:j.id,t:0}}

 for(const k in g){const a=g[k];for(let i=1;i<a.length;i++)if(a[i].c!==a[0].c)v.push({id:'cv'+k+i,a:a[0],b:a[i],virt:1})}return v}

function looseConnIssues(){const out=[],ws=S.wires.map(w=>({w,pts:wireGeo(w)})).filter(x=>x.pts),onSeg=(q,A,B)=>{const minx=Math.min(A.x,B.x)-.5,maxx=Math.max(A.x,B.x)+.5,miny=Math.min(A.y,B.y)-.5,maxy=Math.max(A.y,B.y)+.5;if(q.x<minx||q.x>maxx||q.y<miny||q.y>maxy)return false;return Math.abs((B.x-A.x)*(q.y-A.y)-(B.y-A.y)*(q.x-A.x))<.5*Math.hypot(B.x-A.x,B.y-A.y)};
 for(const c of S.comps)termsOf(c).forEach((_,i)=>{const q=tp(c,i),sh=c.sh||1;for(const{w,pts}of ws){const a=byId(w.a.c);if((a.sh||1)!==sh)continue;if((w.a.c===c.id&&w.a.t===i)||(w.b.c===c.id&&w.b.t===i))continue;
  const P=pts[0],Q=pts[pts.length-1];if(Math.hypot(q.x-P.x,q.y-P.y)<1||Math.hypot(q.x-Q.x,q.y-Q.y)<1)continue;
  for(let k=0;k+1<pts.length;k++)if(onSeg(q,pts[k],pts[k+1])){out.push({c,i,w});return}}});
 return out}
function fixLoose(list){pushHist();let n=0;for(const{c,i,w}of list){if(!S.wires.includes(w))continue;const q=tp(c,i);const e=splitWire(w.id,q);if(e){if(!(e.c===c.id&&e.t===i))S.wires.push(newWire(e,{c:c.id,t:i}));n++}}commit();toast(`${n} ligação(ões) feita(s).`)}
function orphanIssues(){const out=[],C=S.comps,coilT=new Set(C.filter(c=>D(c).outF&&c.tag).map(c=>c.tag)),pre=t=>(t.match(/^[A-Za-z]+/)||[''])[0];
 const orph=[...new Set(C.filter(c=>linkOf(c)==='coil'&&c.tag&&!coilT.has(c.tag)).map(c=>c.tag))];
 for(const o of orph){const cand=C.filter(c=>D(c).load&&D(c).outF&&c.tag&&pre(c.tag)===pre(o)&&!C.some(x=>x.type==='mp'&&x.k==='k'&&x.tag===c.tag)&&!C.some(x=>x!==c&&D(x).outF&&x.tag===o));
  if(cand.length===1){const k=cand[0];out.push({lvl:'aviso',msg:`${o} perdeu a bobina: parece que ela virou ${k.tag}`,why:`Os contatos ${o} não têm bobina, e a bobina ${k.tag} não tem contatos de força. Isso costuma acontecer ao copiar e colar: a cópia ganha um número novo. Renomeie ${k.tag} para ${o}.`,ids:C.filter(c=>c.tag===o||c.tag===k.tag).map(c=>c.id),fix:{label:`Renomear ${k.tag} para ${o}`,fn:()=>{pushHist();const old=k.tag;C.forEach(c=>{if(c.tag===old)c.tag=o});commit();toast(`${old} renomeado para ${o}: os contatos voltaram a seguir a bobina.`)}}})}}

const FAIS_V=1;
let fname='esquema-faisca',toastT;
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className=err?'err':'';t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},err?6500:3500)}
let DLC=null;const dlCap=()=>DLC||(DLC=window.claude&&typeof window.claude.use==='function'?Promise.resolve(window.claude.use('downloads')).catch(()=>null):Promise.resolve(null));
function download(blob,name){dlCap().then(d=>{if(!d)return download0(blob,name);const n=/\.(png|pdf|json|txt|csv|svg|html|zip|md)$/i.test(name)?name:name+'.json';d.save({filename:n,data:blob}).then(()=>{},e=>{const c=e&&e.code;if(c==='declined')return;if(c==='unavailable'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed'){DLC=Promise.resolve(null);return download0(blob,name)}toast('Não consegui baixar o arquivo'+(e&&e.message?': '+e.message:'.'),true)})})}
function download0(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
/* nome de arquivo: só ASCII (sem acento), para não dar problema em nenhum sistema ou navegador */
const safeName=s=>String(s||'').replace(/\.(fais|json)$/i,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9_ -]+/g,'').trim().replace(/\s+/g,'-').slice(0,60)||'esquema-faisca';
const cleanName=s=>String(s==null?'':s).replace(/[\u0000-\u001f]/g,'').trim().slice(0,60);
const num=v=>typeof v==='number'&&Number.isFinite(v);

 const doc={formato:'faisca',versao:FAIS_V,app:'Faísca',autor:'Thiagosystems',criado:new Date().toISOString(),esquema:{comps:S.comps,wires:S.wires,seq:S.seq,sheets:S.sheets,cur:S.cur,doc:S.doc,sp:S.sp,pb:S.pb,nopb:S.nopb}};

const MEM=new Map(),PK='faisca-p-',IK='faisca-idx';let warned=false;

function uniqueName(base,exceptId){base=cleanName(base)||'Sem título';const used=new Set(IDX.list.filter(p=>p.id!==exceptId).map(p=>p.nome.toLowerCase()));

/* cola uma cópia deslocada de (dx,dy). Bobinas e outros itens com identificação própria ganham número novo
   (K1 vira K2); os contatos colados junto passam a seguir a nova bobina; referências como "A1+" também acompanham. */
function pasteData(d,dx,dy){
 pushHist();
 const tmap={},idmap={},nc=[],olds=[];
 for(const o of d.comps){const c=JSON.parse(JSON.stringify(o));idmap[o.id]=c.id='c'+(S.seq++);c.x+=dx;c.y+=dy;olds.push(c.tag);nc.push(c)}
 nc.forEach(c=>{if(ownOf(c))c.tag=''});
 nc.forEach(c=>{c.sh=S.cur||1;S.comps.push(c)});
 nc.forEach((c,i)=>{const pre=ownOf(c);if(pre){const t0=olds[i],busy=!t0||S.comps.some(o=>!nc.includes(o)&&ownOf(o)&&o.tag===t0)||nc.slice(0,i).some(o=>o.tag===t0);c.tag=busy?nextTag(pre):t0;if(olds[i]&&!(olds[i] in tmap))tmap[olds[i]]=c.tag}});
 nc.forEach(c=>{if(!ownOf(c)&&c.tag&&tmap[c.tag])c.tag=tmap[c.tag];
  ['by','sy','sy2'].forEach(k=>{if(typeof c[k]==='string'&&c[k]){const m=c[k].match(/^(.*?)([+\-−]?)$/);if(m&&m[1]&&tmap[m[1]])c[k]=tmap[m[1]]+m[2]}})});
 const nw=[];for(const o of d.wires){const w=JSON.parse(JSON.stringify(o));if(!idmap[w.a.c]||!idmap[w.b.c])continue;w.id='w'+(S.seq++);w.a.c=idmap[w.a.c];w.b.c=idmap[w.b.c];if(num(w.m))w.m+=w.o==='v'?dy:dx;nw.push(w)}
 S.wires.push(...nw);tool=null;sel=mkSel(nc.map(c=>c.id),nw.map(w=>w.id));commit();return{c:nc.length,w:nw.length}}
/* colar: vai para onde está o mouse (no esquema ou na protoboard); sem o mouse na tela, ao lado do original */
let ptrIn=false,pastePt=null;
function pasteClip(){if(mode!=='edit')return;if(!clip){toast('Nada copiado ainda. Selecione componentes e aperte Ctrl+C.',true);return}
 clip.n++;const pb=typeof pbOn==='function'&&pbOn()&&typeof pbPtrIn!=='undefined'&&pbPtrIn,here=pb?{x:pbPtr.x,y:pbPtr.y,pb:1}:ptrIn?{x:ptr.x,y:ptr.y}:null;
 const again=here&&pastePt&&pastePt.pb===here.pb&&Math.abs(pastePt.x-here.x)<1&&Math.abs(pastePt.y-here.y)<1;pastePt=here?{...here}:null;if(!again&&here)clip.k=0;const k=again?(clip.k=(clip.k||0)+1):0;
 let r;if(here&&!pb){const xs=clip.comps.map(c=>c.x),ys=clip.comps.map(c=>c.y),cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;r=pasteData(clip,snap(here.x-cx)+2*G*k,snap(here.y-cy)+2*G*k)}
 else{const po=pasteOffset(clip),off=2*G*clip.n;r=po?pasteData(clip,po.dx+off-2*G,po.dy+off-2*G):pasteData(clip,off,off)}
 if(pb){const nc=[...sel.c].map(byId).filter(c=>c&&num(c.pbx));if(nc.length){const P=typeof PBP!=='undefined'?PBP:10,xs=nc.map(c=>c.pbx),ys=nc.map(c=>c.pby),cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2,dx=Math.round((here.x-cx)/P)*P+2*P*k,dy=Math.round((here.y-cy)/P)*P+2*P*k;nc.forEach(c=>{c.pbx+=dx;c.pby+=dy});commit()}}
 toast(`Colado: ${r.c} componente(s) e ${r.w} fio(s).`)}
function dupSel(){if(mode!=='edit')return;const d=extractSel();if(!d){toast('Selecione um ou mais componentes para duplicar.',true);return}

/* ================= trajeto dos fios ================= */
/* Um fio tem 3 trechos. Sem ajuste, o programa escolhe sozinho. Com ajuste, w.o diz como o fio sai
   ('v' = sai na vertical e o trecho do meio é horizontal, em y = w.m; 'h' = o contrário, em x = w.m). */
function wmode(p,q,w){
 if(w&&(w.o==='v'||w.o==='h')&&Number.isFinite(w.m))return{o:w.o,m:w.m,custom:true};
 if(p.x===q.x||p.y===q.y)return{straight:true};
 return Math.abs(q.y-p.y)>=Math.abs(q.x-p.x)?{o:'v',m:snap((p.y+q.y)/2)}:{o:'h',m:snap((p.x+q.x)/2)}}
function wpts(p,q,w){const r=wmode(p,q,w);if(r.straight)return[p,q];return r.o==='v'?[p,{x:p.x,y:r.m},{x:q.x,y:r.m},q]:[p,{x:r.m,y:p.y},{x:r.m,y:q.y},q]}
function wpath(p,q,w){const r=wmode(p,q,w);if(r.straight)return`M${p.x},${p.y}L${q.x},${q.y}`;return r.o==='v'?`M${p.x},${p.y}V${r.m}H${q.x}V${q.y}`:`M${p.x},${p.y}H${r.m}V${q.y}H${q.x}`}
/* alça no meio do fio selecionado: arrastar muda o trajeto */
function whandle(w){const a=byId(w.a.c),b=byId(w.b.c);if(!a||!b)return null;const p=tp(a,w.a.t),q=tp(b,w.b.t),r=wmode(p,q,w);
 if(r.straight)return p.x===q.x?{x:p.x,y:(p.y+q.y)/2,o:'h'}:{x:(p.x+q.x)/2,y:p.y,o:'v'};
 return r.o==='v'?{x:(p.x+q.x)/2,y:r.m,o:'v'}:{x:r.m,y:(p.y+q.y)/2,o:'h'}}
const selWire=()=>sel&&sel.w.size===1&&!sel.c.size?S.wires.find(x=>x.id===[...sel.w][0]):null;
function flipWire(){const w=selWire();if(!w||mode!=='edit')return;const a=byId(w.a.c),b=byId(w.b.c);if(!a||!b)return;const p=tp(a,w.a.t),q=tp(b,w.b.t);if(p.x===q.x||p.y===q.y)return;
 const o=wmode(p,q,w).o==='v'?'h':'v';pushHist();w.o=o;w.m=o==='v'?snap((p.y+q.y)/2):snap((p.x+q.x)/2);commit()}
function resetWire(){const w=selWire();if(!w||!w.o||mode!=='edit')return;pushHist();delete w.o;delete w.m;commit()}
/* desvio automático: só mexe em fios cujo trajeto atravessa algum componente */
function segHits(a,b,r){if(a.y===b.y)return a.y>r[1]&&a.y<r[3]&&Math.max(a.x,b.x)>r[0]&&Math.min(a.x,b.x)<r[2];
 if(a.x===b.x)return a.x>r[0]&&a.x<r[2]&&Math.max(a.y,b.y)>r[1]&&Math.min(a.y,b.y)<r[3];return false}
function routeHits(pts,obs){for(let i=0;i<pts.length-1;i++)for(const r of obs)if(segHits(pts[i],pts[i+1],r))return true;return false}
/* caixas que um fio não deve atravessar: os outros componentes (com etiqueta e folga de 4) e, só pelo corpo, os dois
   componentes ligados pelo fio. Nesses dois a caixa passa um pouco dos terminais, então o fio só conta se entrar mais
   de 6 de fundo; corpos muito finos (trilho da ladder) não contam, pois o fio sai pelo meio deles. */
function obstaclesFor(a,b){const out=[];for(const c of S.comps){if(c.type==='junction'||!onSheet(c))continue;const own=c===a||c===b,r=wbox(c,!own),g=own?-6:4,R=[r[0]-g,r[1]-g,r[2]+g,r[3]+g];if(R[2]-R[0]<8||R[3]-R[1]<8)continue;out.push(R)}return out}
function avoidWires(ids){
 if(mode!=='edit')return;
 const set=ids?new Set(ids):null,ws=S.wires.filter(w=>(!set||set.has(w.id))&&onSheet(byId(w.a.c)||{}));let fixed=0,stuck=0,pushed=false;
 for(const w of ws){const a=byId(w.a.c),b=byId(w.b.c);if(!a||!b)continue;const p=tp(a,w.a.t),q=tp(b,w.b.t);
  const obs=obstaclesFor(a,b);
  if(!routeHits(wpts(p,q,w),obs))continue;
  const r0=wmode(p,q,null),straight=!!r0.straight,modes=straight?[p.x===q.x?'h':'v']:[r0.o,r0.o==='v'?'h':'v'];
  const ctr=o=>straight?(o==='h'?p.x:p.y):(o==='v'?snap((p.y+q.y)/2):snap((p.x+q.x)/2));
  const cands=[];for(const o of modes)for(let k=0;k<=40;k++)for(const sg of k?[1,-1]:[1])cands.push({o,m:ctr(o)+sg*k*G,c:k*G+(o===modes[0]?0:40)});
  cands.sort((x,y)=>x.c-y.c);
  const hit=cands.find(c=>!routeHits(wpts(p,q,{o:c.o,m:c.m}),obs));
  if(!hit){stuck++;continue}
  if(!pushed){pushHist();pushed=true}
  if(!straight&&hit.o===r0.o&&hit.m===r0.m){delete w.o;delete w.m}else{w.o=hit.o;w.m=hit.m}
  fixed++}
 if(!fixed){toast(stuck?`Não achei um caminho livre para ${stuck} fio(s). Tente arrastar a alça do fio à mão.`:'Nenhum fio está passando por cima de componentes.',!!stuck);return}
 commit();toast(`Desviei ${fixed} fio(s) de componentes.`+(stuck?` ${stuck} não tiveram caminho livre.`:''))}

/* ================= PDF ================= */
/* monta um PDF mínimo com a imagem do diagrama (sem bibliotecas, funciona offline) */
function buildPdf(img,pw,ph,place,title,sub){
 const parts=[];let len=0;const off=[];
 const push=b=>{if(typeof b==='string'){const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++){const c=b.charCodeAt(i);u[i]=c>255?63:c}b=u}parts.push(b);len+=b.length};
 const pes=s=>String(s).replace(/[\\()]/g,m=>'\\'+m).replace(/[\r\n]+/g,' ');
 const obj=(n,body)=>{off[n]=len;push(`${n} 0 obj\n${body}\nendobj\n`)};
 const stream=(n,dict,bytes)=>{off[n]=len;push(`${n} 0 obj\n<< ${dict} /Length ${bytes.length} >>\nstream\n`);push(bytes);push('\nendstream\nendobj\n')};
 push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');

const ST_EX=`(* Partida com selo, parada e temporizador *)
VAR
  T1 : TON;
END_VAR

(* I0.0 = liga (NA), I0.1 = desliga (NF) *)
Q0.0 := (I0.0 OR Q0.0) AND I0.1;

(* Q0.1 liga 3 segundos depois de Q0.0 *)
T1(IN := Q0.0, PT := T#3s);
Q0.1 := T1.Q;
`;
function stDialog(c){const ex=ST_EX;
 openModal(`${tr('Programa ST')} — ${esc(c.tag)}`,`<p class="muted small" style="margin-top:0">${tr('Texto estruturado (IEC 61131-3). Roda a cada varredura com o CLP em RUN, depois do ladder.')} ${pfxOf(c)?tr('Os endereços I/Q/M deste CLP ganham o prefixo')+' '+esc(pfxOf(c))+'.':''}</p>
  <textarea id="stP" spellcheck="false" style="width:100%;min-height:300px;font:13px/1.45 'IBM Plex Mono',monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel2);color:var(--ink);tab-size:2">${esc(c.prog||'')}</textarea>
  <p id="stMsg" class="small" style="min-height:1.4em;margin:6px 0 0"></p>
  <details class="small"><summary>${tr('O que dá para usar')}</summary><p class="muted">${tr('Variáveis: I0.0, Q0.0, M0.0 (liga/desliga), IW64, QW64, MW10 (números), e as declaradas em VAR (BOOL, INT, REAL, TIME). Operadores: := AND OR XOR NOT = <> < > <= >= + - * / MOD. Comandos: IF … THEN … ELSIF … ELSE … END_IF; FOR … TO … DO … END_FOR; WHILE … DO … END_WHILE. Blocos: TON, TOF, TP (IN, PT → Q, ET), CTU (CU, R, PV → Q, CV), CTD (CD, LD, PV → Q, CV), R_TRIG e F_TRIG (CLK → Q). Tempo: T#500ms, T#3s, T#1m30s. Comentários: (* … *) ou //.')}</p></details>`,
  `<button data-ex="1">${tr('Inserir exemplo')}</button><button data-chk="1">${tr('Verificar')}</button><button data-mx="1">${tr('Cancelar')}</button><button class="pri" data-ok="1">${tr('Salvar')}</button>`,e=>{
   const ta=document.getElementById('stP'),msg=document.getElementById('stMsg');const chk=()=>{try{stCompile(ta.value);msg.textContent=tr('Programa sem erros.');msg.style.color='var(--ok)';return true}catch(er){msg.textContent=`${tr('Linha')} ${er.ln||'?'}: ${er.msg||er}`;msg.style.color='var(--err)';return false}};
   if(e.target.closest('[data-ex]')){if(!ta.value.trim()||confirm(tr('Trocar o programa atual pelo exemplo?')))ta.value=ex;chk()}
   else if(e.target.closest('[data-chk]'))chk();
   else if(e.target.closest('[data-ok]')){chk();pushHist();c.prog=ta.value;closeModal();commit()}});
 const ta=document.getElementById('stP');if(ta)ta.addEventListener('keydown',ev=>{if(ev.key==='Tab'){ev.preventDefault();const s=ta.selectionStart;ta.setRangeText('  ',s,ta.selectionEnd,'end')}})}
{const _rp=renderProps;renderProps=function(){_rp();if(mode!=='edit'||!sel||!sel.c||sel.c.size!==1)return;const c=byId([...sel.c][0]);if(!c||!isCPU(c))return;const el=$('#props');if(!el)return;
 const d=document.createElement('div');d.className='row';d.innerHTML=`<button type="button" id="bST">${tr('Programa em texto (ST)…')}</button>`;el.appendChild(d);d.querySelector('#bST').onclick=()=>stDialog(c)}}

const HELP=[
/* ---- funções do programa ---- */
['Colocar um componente','colocar inserir adicionar paleta posicionar','','Escolha o item na paleta da esquerda (ou busque pelo nome) e clique no desenho onde ele deve ficar. Clique de novo no item da paleta para desistir.','Busque "resistor", clique nele e depois clique no meio da folha: o R1 aparece ali.'],
['Ligar um fio','fio ligar conectar ligação desenhar fio terminal bolinha','','Clique numa bolinha azul (terminal) e depois em outra. Cada clique no vazio faz uma curva, sempre em ângulo reto. Terminar em cima de outro fio cria um ponto de conexão. Botão direito ou Esc cancela.','Clique no terminal de cima da lâmpada, clique no vazio acima dela e depois no terminal da fonte: o fio sobe e vira reto até a fonte.'],
['Fio que não fica reto','fio torto curva reto alinhado desalinhado entortar','','O fio sai reto quando os dois terminais estão na mesma linha. Ao terminar um fio, a última curva é puxada sozinha para alinhar com o terminal (até 2 casas de diferença). Se ainda ficar torto, arraste um dos componentes para alinhar, ou clique no fio e arraste a bolinha do meio.','Resistor em cima e NE555 embaixo: arraste o resistor até a bolinha dele ficar na mesma vertical do pino; o fio fica reto.'],
['Mover, girar e apagar','mover arrastar girar rotacionar apagar excluir deletar','','Arraste o componente para mover (os fios vão junto). R gira 90°. Del apaga o que estiver selecionado. Ctrl+Z desfaz.','Selecione o motor, aperte R duas vezes: ele fica de cabeça para baixo.'],
['Selecionar vários','selecionar seleção retângulo varios multiplos shift ctrl','','Arraste no vazio para desenhar um retângulo de seleção. Shift ou Ctrl + clique adiciona ou tira itens. Ctrl+A seleciona tudo.','Arraste um retângulo em volta do circuito de comando e mova tudo de uma vez.'],
['Copiar, colar e duplicar','copiar colar duplicar ctrl+c ctrl+v ctrl+d','','Ctrl+C copia a seleção, Ctrl+V cola, Ctrl+D duplica. Bobinas coladas ganham número novo (K1 vira K2) e os contatos colados junto acompanham.','Monte um degrau de partida, selecione, Ctrl+D: aparece outro igual já com K2.'],
['Mudar o nome (tag) e arrastar o nome','nome tag identificação etiqueta arrastar nome K1 renomear','','Selecione o componente e troque o nome no painel da direita. Para tirar o nome de cima do desenho, arraste o próprio texto do nome. O botão "Voltar o nome para o lugar padrão" desfaz.','Clique e arraste o texto "R3" para baixo do resistor.'],
['Redimensionar (diminuir/aumentar)','tamanho diminuir aumentar escala pinça caber folha encaixar','','Selecione parte do circuito e arraste um quadradinho do canto da seleção. No painel há 50%, 75%, 100% e "Caber na folha". Em Documentação, "Encaixar o esquema na folha" ajusta tudo.','Selecione o circuito inteiro e clique em "Caber na folha" para ele ficar dentro da moldura.'],
['Rótulo de rede','rótulo rede label net nome do fio ligar sem fio','netl','O rótulo de rede liga pontos que têm o mesmo nome, sem precisar puxar um fio comprido. Clique num rótulo (ou num fio) para destacar a rede inteira e ver no painel tudo o que está ligado nela.','Coloque um rótulo "CLK" no pino 3 do 555 e outro "CLK" no pino 11 do 595: os dois ficam ligados.'],
['Ligação entre folhas','ligação entre folhas folha outra página xref','xref','Liga um ponto de uma folha a outro ponto, em outra folha, com o mesmo nome. Mostra para onde vai (referência cruzada).','Na folha de força, ponha "L1-CMD" no fio que alimenta o comando; na folha de comando, outra "L1-CMD".'],
['Folhas, carimbo e moldura','folha página carimbo moldura título autor data','','Use "+ Folha" para separar força e comando. Em Documentação ficam a moldura com colunas, o carimbo (título, autor, data), a numeração dos fios e a lista de materiais.','Abra Documentação → Carimbo e escreva o nome da turma e dos integrantes.'],
['Lista de materiais','lista materiais bom peças quantidade csv','','Documentação → Lista de materiais mostra todos os itens com quantidade e identificação. Dá para baixar em CSV ou PDF.','Útil para montar a bancada: aparece "3 × Contato NA" com as tags.'],
['Exportar PDF','pdf imprimir exportar folha','','Arquivo → Exportar PDF gera um PDF vetorial com todas as folhas, carimbo e lista de materiais.','Para entregar um trabalho impresso.'],
['Exportar imagem PNG','png imagem foto print whatsapp exportar','','Arquivo → Exportar imagem PNG salva a folha atual como imagem, com fundo branco, para colar em trabalhos e mensagens.','Exporte e mande no grupo do WhatsApp.'],
['Salvar e abrir arquivos .fais','salvar abrir arquivo fais guardar projeto backup','','Tudo é salvo sozinho no navegador. Para levar a outro computador ou guardar cópia, use Arquivo → Salvar arquivo .fais; para abrir, Arquivo → Abrir arquivo .fais.','Salve "partida-direta.fais" no pen drive e abra no computador da escola.'],
['Meus projetos','projetos lista novo projeto renomear duplicar excluir','','Arquivo → Meus projetos lista os projetos deste navegador: abrir, renomear, duplicar e excluir.','Duplique um projeto antes de testar uma mudança grande.'],
['Blocos reutilizáveis','bloco blocos reaproveitar biblioteca meus blocos salvar seleção','','Selecione parte do circuito e clique em "Salvar como bloco". Ele aparece na paleta em "20. Meus blocos"; clique para colocar uma cópia. Em "Gerenciar blocos…" dá para renomear, excluir, exportar e importar.','Salve "LED + resistor 330 Ω" como bloco e use em todos os projetos.'],
['Modelos prontos','modelo exemplo pronto template circuito pronto','','A lista "Modelos prontos" abre circuitos completos num projeto novo: partidas, reversão, estrela-triângulo, CLP, ladder, GRAFCET, pneumática, eletrônica, 555, 595 e outros.','Abra "Estrela-triângulo com comando 24 Vcc" e aperte Simular.'],
['Simular','simular simulação rodar testar play parar','','Aperte Simular: o Faísca calcula tensões e correntes reais. Clique nas botoeiras, chaves, sensores e no CLP para operar. Parar volta para a edição.','Na partida direta, clique em S1: K1 fecha e o motor gira.'],
['Velocidade da simulação','velocidade câmera lenta tempo simulado rápido khz frequência','','Durante a simulação, o seletor "Velocidade" deixa o tempo mais lento: 1/10, 1/100, 1/1000×. Serve para ver sinais rápidos (555 em kHz, PWM) no osciloscópio. O tempo simulado aparece ao lado.','No modelo "NE555 a 1,5 kHz", a velocidade 1/1000× mostra as ondas de 1,5 kHz devagar.'],
['Diagnóstico e problemas','diagnóstico problemas erro aviso o que faz eventos selo','','O painel Diagnóstico explica o que o circuito faz, lista problemas (fio solto, curto, bobina sem contato…) com correção em um clique, e registra os eventos da simulação.','Um "!" laranja no componente mostra um aviso. Clique nele no painel para ver o motivo.'],
['Osciloscópio e gráfico','osciloscópio gráfico onda forma de onda medir tempo','scope','Ligue o osciloscópio (CH1 e CH2) nos pontos a medir. Na simulação aparece a forma de onda; "Ao longo do tempo" mostra a tensão e a corrente dos componentes marcados com "Acompanhar no gráfico".','Ligue CH1 na saída do 555 e CH2 no capacitor: aparecem a onda quadrada e a "dente de serra".'],
['Multímetro de pontas','multímetro pontas ponta de prova medir tensão protoboard','mmeter','Na protoboard, o multímetro tem duas pontas (preta = COM, vermelha = VΩ). Arraste cada ponta até um furo ou terminal: ele mostra a tensão entre os dois pontos, também durante a simulação, sem mudar o circuito.','Ponta preta no GND e vermelha no meio de dois resistores: aparece a tensão do divisor.'],
['Montar na protoboard','montar automático protoboard jumpers encaixar','','O botão ⚡ Montar na protoboard encaixa sozinho as peças que estão fora da placa e liga tudo com jumpers coloridos (GND preto, + vermelho). A simulação continua igual.','Abra um modelo pronto, ligue o Protoboard e clique em Montar.'],
['Placas: Nano, Mega, ESP32 e Pico','arduino nano mega esp32 raspberry pi pico placa microcontrolador gpio','nano mega esp32 pico','Além do Uno e do micro:bit há Arduino Nano e Mega (5 V) e ESP32 e Raspberry Pi Pico (3,3 V). Todos rodam o mesmo C++ do Arduino. No ESP32 o analogRead vai de 0 a 4095; no Pico os pinos analógicos são GP26 a GP28.','Pico: pinMode(15, OUTPUT); digitalWrite(15, HIGH) acende um LED no GP15.'],
['Projetos com Arduino','galeria projetos prontos semáforo alarme termômetro servo distância contador neopixel','','Em Modelos prontos → Projetos com Arduino há circuitos completos, já montados na protoboard e com o programa pronto: semáforo, alarme com PIR, termômetro com LCD, servo com potenciômetro, sensor de distância, contador e anel NeoPixel.','Escolha "Semáforo", clique em Simular e aperte o botão de pedestre.'],
['Modo Protoboard','protoboard breadboard placa de ensaio montagem física tinkercad fios jumper','','O botão Protoboard mostra o mesmo circuito montado de verdade: peças coloridas numa placa de ensaio. Tudo fica ligado ao esquema: o que você liga num lado aparece no outro, e a simulação funciona nos dois.','Encaixe o resistor e o LED na mesma coluna da protoboard: no esquema aparece o fio entre eles.'],
['Configurações','configurações idioma tema escuro claro grade valores','','Na engrenagem: idioma, tema claro/escuro e o que aparece no desenho (valores, medições, números dos terminais, grade, selos).','Desligue "Números dos terminais" para um desenho mais limpo.'],
['Atalhos de teclado','atalho teclado tecla ctrl','','R gira · Del apaga · Ctrl+A, C, V, D: selecionar tudo, copiar, colar, duplicar · Ctrl+Z / Ctrl+Y desfazer e refazer · Ctrl+S salvar · Ctrl+O abrir · Esc cancela · Ctrl+Shift+F esconde os painéis.',''],
['Instalar como aplicativo','instalar aplicativo app celular offline sem internet','','No Chrome/Edge: ícone de instalar na barra de endereço ou Arquivo → Instalar aplicativo. No Android: menu ⋮ → Instalar. No iPhone: Compartilhar → Adicionar à Tela de Início. Depois funciona sem internet.',''],
/* ---- alimentação e proteção ---- */
['Fontes: fase, neutro, terra, + e −','fonte fase neutro terra pe positivo negativo alimentação 24v 220v','src supply','Cada símbolo de fonte é um ponto ligado à rede: L1, L2, L3 (fases), N (neutro), PE (terra), + e − (corrente contínua). Dá para mudar a tensão no painel.','Comando em 24 Vcc: use + no alto do circuito e − embaixo.'],
['Bateria','bateria pilha 9v 12v','bat','Fonte de corrente contínua com resistência interna. Em curto, ela aquece e o Faísca avisa.','Bateria de 9 V + resistor de 470 Ω + LED: o LED acende com uns 15 mA.'],
['Transformador','transformador abaixador 220 24 trafo','xfmr xfmr3','Muda a tensão alternada: o primário (1-2) recebe a rede, o secundário (3-4) entrega a tensão menor. Não passa corrente contínua.','220 V no primário e 24 V no secundário para o comando.'],
['Retificador e fonte 24 Vcc','retificador ponte diodos fonte cc 24vcc','rect psu','A ponte de diodos transforma CA em CC. "Ideal" entrega a mesma tensão; "com capacitor" chega perto do pico. A fonte 24 Vcc já faz tudo e entrega 24 V.','Transformador 24 V → ponte → + e − do comando.'],
['Fusível, seccionador e disjuntor','fusível disjuntor seccionador proteção curto sobrecarga curva b c d','mp','O fusível queima e o disjuntor desarma com sobrecarga (aquecimento) ou curto (na hora). Curvas B, C, D mudam a tolerância à partida de motores. Clique para rearmar ou trocar.','Disjuntor de 6 A curva C protegendo um motor de 2 A.'],
['DR (diferencial residual)','dr diferencial fuga choque idr','mp','Desarma quando parte da corrente vai para a terra (fuga), por exemplo num choque. Corrente de disparo comum: 30 mA.','Ligue uma lâmpada da fase para o PE: o DR desarma.'],
['Relé térmico','relé térmico sobrecarga 95-96 97-98 ft','ftpow ftnc ftno','Protege o motor de sobrecarga pela corrente real. Quando atua, abre o 95-96 (desliga o comando) e fecha o 97-98 (sinaliza).','Ajuste em 4 A num motor de 5 A: depois de alguns segundos ele desarma.'],
/* ---- comando ---- */
['Contator','contator bobina k1 a1 a2 selo intertravamento','coil','A bobina (A1-A2) energizada puxa os contatos com o mesmo nome. Abaixo de 80% da tensão ela não atraca.','K1 com contato 13-14 em paralelo com o botão liga: é o selo.'],
['Contatos NA, NF e comutador','contato na nf aberto fechado 13-14 11-12 comutador','kno knc kco','NA (normalmente aberto) fecha quando a bobina liga; NF (normalmente fechado) abre. A numeração (13-14, 21-22…) dá para mudar no painel.','K1 NF (21-22) em série com a bobina de K2 impede os dois ligados juntos (intertravamento).'],
['Botoeiras','botoeira botão liga desliga emergência pulsador retenção','btn btn2 btnco btnl sel3','Botão de impulso volta ao soltar; com retenção fica travado. Emergência é NF e trava. Na simulação: clique e segure; Shift + clique deixa segurado.','S0 (NF) desliga, S1 (NA) liga.'],
['Temporizador','temporizador timer retardo energização desenergização tempo','tcoil ktno ktnc','Na energização: os contatos mudam depois do tempo ajustado. Na desenergização: mudam na hora e voltam depois do tempo.','Estrela-triângulo: KT1 de 5 s troca de estrela para triângulo.'],
['Relé cíclico e de impulso','pisca cíclico impulso telerruptor','cyc imp','O cíclico liga e desliga sozinho (pisca). O de impulso troca de estado a cada pulso, como um interruptor de várias posições.','Escada com 3 botões ligando o mesmo relé de impulso.'],
['Fim de curso e sensores','fim de curso sensor indutivo capacitivo fotoelétrico detector','lim sens','Fim de curso é acionado mecanicamente (por um cilindro, por exemplo). Sensores detectam peças sem contato. Clique para acionar.','Fim de curso A1+ para o cilindro quando ele chega ao fim.'],
['Sinaleiro, lâmpada e buzina','sinaleiro lâmpada lampada buzina sirene alarme','lamp snd','Acendem/tocam com tensão. Lâmpada com tensão acima da nominal queima.','Sinaleiro verde em paralelo com K1: mostra "motor ligado".'],

['Motor trifásico','motor trifásico partida corrente de partida rotação inverter sentido','motor mot6 dahl','Gira quando recebe as 3 fases. Trocar duas fases inverte o sentido. Na partida puxa várias vezes a corrente nominal (campo "Corrente de partida") por um tempo.','Partida direta: K1 liga L1, L2 e L3 no motor.'],
['Partida estrela-triângulo','estrela triângulo y delta partida reduzida','mot6','Liga o motor em estrela (corrente de partida 3× menor) e, depois do tempo, troca para triângulo. Precisa de motor de 6 terminais.','Modelo pronto "Estrela-triângulo com comando 24 Vcc".'],
['Motor monofásico e CC','motor monofásico cc corrente contínua','mot1 motdc','O monofásico usa fase e neutro. O CC inverte o sentido trocando + e −.','Motor CC 24 V com dois contatores para avante e reverso.'],

['Vários CLPs no mesmo projeto','vários clp duas cpu prefixo endereço clp2','plc','Dê um prefixo a cada CLP extra (campo "Prefixo dos endereços"): os endereços dele viram CLP2.I0.0, CLP2.Q0.0… O programa ST de cada CPU usa os próprios endereços sem prefixo. Módulos com o mesmo prefixo seguem essa CPU.','CLP1 controla a esteira, CLP2 (prefixo CLP2) controla a prensa.'],

const hNorm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function helpSearch(q){const w=hNorm(q).split(/\s+/).filter(x=>x.length>1);if(!w.length)return HELP.map((h,i)=>({h,i,sc:0}));
 return HELP.map((h,i)=>{const t=hNorm(h[0]),k=hNorm(h[1]+' '+h[2]),b=hNorm(h[3]+' '+h[4]);let sc=0;for(const x of w){if(t.includes(x))sc+=6;if(k.includes(x))sc+=4;if(b.includes(x))sc+=1}if(hNorm(q).trim()&&t.includes(hNorm(q).trim()))sc+=8;return{h,i,sc}}).filter(r=>r.sc>0).sort((a,b)=>b.sc-a.sc)}
const helpCard=(h,open)=>`<details class="hcard"${open?' open':''}><summary>${esc(h[0])}</summary><p>${esc(h[3])}</p>${h[4]?`<p class="hex"><b>Exemplo:</b> ${esc(h[4])}</p>`:''}</details>`;
function helpRender(q,pick){const el=document.getElementById('hRes');if(!el)return;let r=helpSearch(q);if(pick!=null&&!q){const k=r.findIndex(x=>x.i===pick);if(k>0)r=[r[k],...r.slice(0,k),...r.slice(k+1)]}
 el.innerHTML=r.length?r.slice(0,q?20:200).map((x,k)=>helpCard(x.h,(pick!=null?x.i===pick:q&&k===0))).join(''):`<p class="muted">Nada encontrado. Tente outra palavra (ex.: "contator", "fio", "555", "ladder").</p>`}
function helpForComp(c){if(!c)return-1;const k=c.type==='ic'?String(c.k||''):'';if(k){const i=HELP.findIndex(h=>h[2].split(' ').includes('ic')&&hNorm(h[0]+' '+h[1]).includes(hNorm(k.replace(/^74HC|^CD/,''))));if(i>=0)return i;return HELP.findIndex(h=>h[2]==='ic')}
 return HELP.findIndex(h=>h[2].split(' ').includes(c.type))}

 'Encoder rotativo KY-040':`// CLK no D2, DT no D3, SW no D4. Clique nas laterais do encoder para girar e no meio para apertar.
int posicao = 0;
int ultimo;

void setup() {
  Serial.begin(9600);
  pinMode(2, INPUT);
  pinMode(3, INPUT);
  pinMode(4, INPUT_PULLUP);
  ultimo = digitalRead(2);
}

void loop() {
  int clk = digitalRead(2);
  if (clk != ultimo && clk == LOW) {
    if (digitalRead(3) != clk) posicao++; else posicao--;
    Serial.print("posição: ");
    Serial.println(posicao);
  }
  ultimo = clk;
  if (digitalRead(4) == LOW) { Serial.println("botão!"); delay(300); }
}`,
